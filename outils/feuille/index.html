<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Identification des feuilles – Schémas & Photos</title>
    <style>
        /* ---------- Reset & Base ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f4f0ea;
            color: #2d2a24;
            display: flex;
            min-height: 100vh;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 280px;
            background: #2d4a3b;
            color: #e8f0e8;
            padding: 1.8rem 1.2rem;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }
        .sidebar h1 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            border-bottom: 2px solid #5f7e6b;
            padding-bottom: 0.8rem;
            margin-bottom: 1.5rem;
            color: #d4e6d4;
        }
        .sidebar h1 small {
            display: block;
            font-size: 0.7rem;
            font-weight: 300;
            color: #b0cdb0;
            margin-top: 0.2rem;
        }
        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .sidebar nav a {
            color: #d4e6d4;
            text-decoration: none;
            padding: 0.45rem 0.8rem;
            border-radius: 6px;
            font-size: 0.88rem;
            transition: background 0.2s, color 0.2s;
            border-left: 3px solid transparent;
            cursor: pointer;
        }
        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: #3c5f4d;
            color: #fff;
            border-left-color: #b8d9b0;
        }
        .sidebar nav .cat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #8faf8f;
            padding: 0.8rem 0.8rem 0.2rem;
            font-weight: 600;
        }

        /* ---------- Main ---------- */
        .main {
            margin-left: 280px;
            flex: 1;
            padding: 2rem 2.5rem 4rem;
            max-width: 1300px;
        }
        .main header {
            margin-bottom: 2.5rem;
        }
        .main header h2 {
            font-size: 2rem;
            font-weight: 400;
            color: #2d4a3b;
            letter-spacing: -0.01em;
        }
        .main header p {
            color: #5f5a52;
            font-size: 1.05rem;
            margin-top: 0.3rem;
        }
        .main header .badge-count {
            font-size: 0.8rem;
            background: #e6ede6;
            color: #2d4a3b;
            padding: 0.15rem 0.9rem;
            border-radius: 20px;
            display: inline-block;
            margin-top: 0.3rem;
        }

        /* ---------- Grid ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }
        .card {
            background: #fffcf9;
            border-radius: 16px;
            padding: 1.2rem 1.2rem 1.4rem;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.2s;
            border: 1px solid #e4ddd4;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.07);
        }
        .card .term {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1f3a2d;
            margin-bottom: 0.2rem;
        }
        .card .term small {
            font-weight: 400;
            font-size: 0.75rem;
            color: #6f7a6a;
            margin-left: 0.4rem;
        }
        .card .def {
            font-size: 0.88rem;
            color: #3f3a32;
            margin: 0.3rem 0 0.7rem;
            line-height: 1.5;
            flex: 0 0 auto;
        }
        .card .svg-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            background: #fcf9f5;
            border-radius: 10px;
            border: 1px solid #eae3d9;
            padding: 0.3rem;
            cursor: zoom-in;
        }
        .card .svg-wrap svg {
            display: block;
            width: 100%;
            height: auto;
            max-height: 160px;
        }
        .card .tag {
            display: inline-block;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #e6ede6;
            color: #2d4a3b;
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            margin-top: 0.6rem;
            align-self: flex-start;
        }

        /* ---------- Schéma / Photo labels & photo slot ---------- */
        .card .media-label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #8a9a7a;
            font-weight: 600;
            margin: 0.55rem 0 0.2rem;
        }
        .photo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
        }
        .photo-add {
            cursor: pointer;
            font-size: 0.74rem;
            color: #2d4a3b;
            background: #e6ede6;
            border: 1px dashed #9bb59b;
            border-radius: 9px;
            padding: 0.5rem 0.7rem;
            text-align: center;
            width: 100%;
            transition: background 0.15s;
        }
        .photo-add:hover {
            background: #d6e2d6;
        }
        .photo-thumb {
            position: relative;
        }
        .photo-thumb .rm {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #c0523f;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            line-height: 16px;
            padding: 0;
            cursor: pointer;
            display: none;
        }
        .photo-thumb:hover .rm {
            display: block;
        }
        .photo-area.has-photo {
            border-style: solid;
            border-color: #e4ddd4;
            background: #fcf9f5;
        }
        .photo-empty {
            font-size: 0.72rem;
            color: #a68c72;
            text-align: center;
            line-height: 1.5;
        }
        .photo-empty code {
            background: #efe6da;
            color: #4d6b4d;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.68rem;
            display: inline-block;
            margin-top: 4px;
        }
        .photo-gallery {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .photo-gallery img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 7px;
            cursor: zoom-in;
            border: 1px solid #e4ddd4;
            transition: transform 0.15s;
        }
        .photo-gallery img:hover {
            transform: scale(1.06);
        }

        /* ---------- Lightbox ---------- */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
        }
        .lightbox.open {
            display: flex;
        }
        .lightbox img {
            max-width: 92%;
            max-height: 92%;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .lightbox .lb-svg {
            display: none;
            background: #fffdf9;
            border-radius: 12px;
            padding: 26px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .lightbox .lb-svg svg {
            width: min(70vw, 560px);
            height: auto;
            display: block;
        }
        .lightbox .close {
            position: absolute;
            top: 1rem;
            right: 1.6rem;
            color: #fff;
            font-size: 2.4rem;
            line-height: 1;
            cursor: pointer;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 820px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
                padding: 1.2rem 1rem;
            }
            .menu-toggle {
                display: inline-block;
                background: #2d4a3b;
                color: #fff;
                border: none;
                padding: 0.4rem 1.2rem;
                border-radius: 6px;
                font-size: 1rem;
                margin-bottom: 1rem;
                cursor: pointer;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
        @media (min-width: 821px) {
            .menu-toggle {
                display: none;
            }
        }

        /* ---------- utility ---------- */
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #1f3328;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #5f7e6b;
            border-radius: 4px;
        }
        .mt-1 {
            margin-top: 1rem;
        }
    </style>
</head>

        <nav id="nav">

    <main class="main" id="mainContent">

        <div class="grid" id="gridContainer">

    </main>

                    svg: `<svg viewBox="0 0 200 140"><rect x="30" y="20" width="140" height="100" rx="8" fill="#dce8d4" stroke="#5f7e5f" stroke-width="1.5"/><path d="M45,35 Q65,25 85,35 Q105,25 125,35 Q145,25 155,35" stroke="#8a9a7a" stroke-width="1.8" fill="none"/><path d="M40,55 Q60,45 80,55 Q100,45 120,55 Q140,45 160,55" stroke="#8a9a7a" stroke-width="1.8" fill="none"/><path d="M45,75 Q65,65 85,75 Q105,65 125,75 Q145,65 155,75" stroke="#8a9a7a" stroke-width="1.8" fill="none"/><path d="M50,95 Q70,85 90,95 Q110,85 130,95 Q150,85 160,95" stroke="#8a9a7a" stroke-width="1.8" fill="none"/></svg>`
                }, {
                    term: 'Ponctuée <small>(Punctate)</small>',
                    def: 'Ponctuée de petites fossettes, glandes ou points colorés.',
                    svg: `<svg viewBox="0 0 200 140"><rect x="30" y="20" width="140" height="100" rx="8" fill="#dce8d4" stroke="#5f7e5f" stroke-width="1.5"/><circle cx="55" cy="40" r="2.5" fill="#6a7a5a"/><circle cx="80" cy="35" r="2.5" fill="#6a7a5a"/><circle cx="105" cy="38" r="2.5" fill="#6a7a5a"/><circle cx="130" cy="42" r="2.5" fill="#6a7a5a"/><circle cx="60" cy="65" r="2.5" fill="#6a7a5a"/><circle cx="90" cy="60" r="2.5" fill="#6a7a5a"/><circle cx="120" cy="62" r="2.5" fill="#6a7a5a"/><circle cx="150" cy="58" r="2.5" fill="#6a7a5a"/><circle cx="70" cy="90" r="2.5" fill="#6a7a5a"/><circle cx="100" cy="88" r="2.5" fill="#6a7a5a"/><circle cx="135" cy="92" r="2.5" fill="#6a7a5a"/></svg>`
                }, {
                    term: 'Striée <small>(Striate)</small>',
                    def: 'Marquée de fines lignes ou rainures, souvent parallèles.',
                    svg: `<svg viewBox="0 0 200 140"><rect x="30" y="20" width="140" height="100" rx="8" fill="#dce8d4" stroke="#5f7e5f" stroke-width="1.5"/><line x1="45" y1="35" x2="155" y2="35" stroke="#8a9a7a" stroke-width="1.2"/><line x1="45" y1="55" x2="155" y2="55" stroke="#8a9a7a" stroke-width="1.2"/><line x1="45" y1="75" x2="155" y2="75" stroke="#8a9a7a" stroke-width="1.2"/><line x1="45" y1="95" x2="155" y2="95" stroke="#8a9a7a" stroke-width="1.2"/></svg>`
                }, {
                    term: 'Lépidote <small>(Lepidote)</small>',
                    def: 'Couverte de petites écailles furfuracées.',
                    svg: `<svg viewBox="0 0 200 140"><rect x="30" y="20" width="140" height="100" rx="8" fill="#dce8d4" stroke="#5f7e5f" stroke-width="1.5"/><ellipse cx="60" cy="40" rx="8" ry="5" fill="#b0c0a0" stroke="#8a9a7a" stroke-width="1"/><ellipse cx="100" cy="35" rx="9" ry="5" fill="#b0c0a0" stroke="#8a9a7a" stroke-width="1"/><ellipse cx="140" cy="40" rx="8" ry="5" fill="#b0c0a0" stroke="#8a9a7a" stroke-width="1"/><ellipse cx="75" cy="70" rx="7" ry="4" fill="#b0c0a0" stroke="#8a9a7a" stroke-width="1"/><ellipse cx="120" cy="65" rx="8" ry="4" fill="#b0c0a0" stroke="#8a9a7a" stroke-width="1"/><ellipse cx="90" cy="95" rx="7" ry="4" fill="#b0c0a0" stroke="#8a9a7a" stroke-width="1"/></svg>`
                }, {
                    term: 'Glauque <small>(Glaucous)</small>',
                    def: 'Couverte d’une pruine cireuse blanchâtre ou bleutée.',
                    svg: `<svg viewBox="0 0 200 140"><rect x="30" y="20" width="140" height="100" rx="8" fill="#c8d8d4" stroke="#5f7e5f" stroke-width="1.5"/><ellipse cx="100" cy="70" rx="45" ry="40" fill="#b0c8c4" stroke="#8aaa9a" stroke-width="1.2"/></svg>`
                }]
            }

        };

        // --------------------------------------------------------------
        //  UTILITAIRES PHOTOS
        // --------------------------------------------------------------
        // Génère un nom de fichier propre à partir du terme.
        // Ex : "Clasping (Amplexicaul)" -> "clasping" ; "Even-pinnate" -> "even-pinnate"
        function slugify(term) {
            // term peut être "Ovale <small>(Ovate)</small>" :
            // on prend le terme scientifique anglais entre parenthèses pour le nom de fichier.
            var t = term.replace(/<[^>]*>/g, '');   // enlève les balises HTML
            var m = t.match(/\(([^)]+)\)/);          // texte entre parenthèses = terme anglais
            if (m) t = m[1];
            return t.toLowerCase().trim()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // --------------------------------------------------------------
        //  PHOTOS — enregistrées dans le navigateur (IndexedDB), ajout par clic.
        //  Se replie aussi sur des fichiers images/<slug>.jpg si présents.
        // --------------------------------------------------------------
        let _db;
        function openDB() {
            return new Promise((res, rej) => {
                if (_db) return res(_db);
                const r = indexedDB.open('leafPhotos', 1);
                r.onupgradeneeded = () => r.result.createObjectStore('photos');
                r.onsuccess = () => { _db = r.result; res(_db); };
                r.onerror = () => rej(r.error);
            });
        }
        async function getStored(slug) {
            try {
                const d = await openDB();
                return await new Promise(res => {
                    const req = d.transaction('photos', 'readonly').objectStore('photos').get(slug);
                    req.onsuccess = () => res(req.result || []);
                    req.onerror = () => res([]);
                });
            } catch (e) { return []; }
        }
        async function setStored(slug, arr) {
            try {
                const d = await openDB();
                await new Promise(res => {
                    const req = d.transaction('photos', 'readwrite').objectStore('photos').put(arr, slug);
                    req.onsuccess = () => res();
                    req.onerror = () => res();
                });
            } catch (e) {}
        }
        // Redimensionne la photo (max 1400 px) pour ne pas saturer le stockage.
        function fileToDataURL(file, maxDim, quality) {
            maxDim = maxDim || 1400; quality = quality || 0.85;
            return new Promise(res => {
                const fr = new FileReader();
                fr.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (Math.max(w, h) > maxDim) {
                            const s = maxDim / Math.max(w, h);
                            w = Math.round(w * s); h = Math.round(h * s);
                        }
                        const c = document.createElement('canvas');
                        c.width = w; c.height = h;
                        c.getContext('2d').drawImage(img, 0, 0, w, h);
                        try { res(c.toDataURL('image/jpeg', quality)); }
                        catch (e) { res(fr.result); }
                    };
                    img.onerror = () => res(fr.result);
                    img.src = fr.result;
                };
                fr.readAsDataURL(file);
            });
        }

        async function setupPhotos(area, slug) {
            const gallery = document.createElement('div');
            gallery.className = 'photo-gallery';
            const add = document.createElement('label');
            add.className = 'photo-add';
            add.innerHTML = '＋ Ajouter une photo';
            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
            inp.style.display = 'none';
            add.appendChild(inp);
            area.appendChild(gallery);
            area.appendChild(add);

            let stored = [];

            function drawThumb(src, removable, idx) {
                const wrap = document.createElement('div');
                wrap.className = 'photo-thumb';
                const im = document.createElement('img');
                im.src = src; im.loading = 'lazy';
                im.addEventListener('click', () => openLightbox(src));
                wrap.appendChild(im);
                if (removable) {
                    const rm = document.createElement('button');
                    rm.className = 'rm'; rm.textContent = '×'; rm.title = 'Retirer';
                    rm.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        stored.splice(idx, 1);
                        await setStored(slug, stored);
                        renderAll();
                    });
                    wrap.appendChild(rm);
                }
                gallery.appendChild(wrap);
            }
            function renderAll() {
                gallery.innerHTML = '';
                stored.forEach((src, idx) => drawThumb(src, true, idx));
                // fichiers pré-déposés dans images/ (utile pour la version en ligne)
                ['jpg', 'jpeg', 'png', 'webp'].forEach(ext => {
                    const url = 'images/' + slug + '.' + ext;
                    const t = new Image();
                    t.onload = () => drawThumb(url, false);
                    t.src = url;
                });
            }
            renderAll();
            // charge les photos ajoutées par l'utilisateur (IndexedDB) sans bloquer l'affichage
            getStored(slug).then(arr => { if (arr && arr.length) { stored = arr; renderAll(); } }).catch(() => {});

            inp.addEventListener('change', async () => {
                for (const file of inp.files) {
                    const dataURL = await fileToDataURL(file);
                    stored.push(dataURL);
                }
                await setStored(slug, stored);
                inp.value = '';
                renderAll();
            });
        }

        // --------------------------------------------------------------
        //  LIGHTBOX (agrandir une photo)
        // --------------------------------------------------------------
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lbImg');
        const lbSvg = document.getElementById('lbSvg');
        function openLightbox(src) {
            lbSvg.style.display = 'none'; lbSvg.innerHTML = '';
            lbImg.style.display = 'block'; lbImg.src = src;
            lb.classList.add('open');
        }
        function openLightboxSVG(html) {
            lbImg.style.display = 'none'; lbImg.removeAttribute('src');
            lbSvg.innerHTML = html; lbSvg.style.display = 'block';
            lb.classList.add('open');
        }
        lb.addEventListener('click', (e) => {
            if (e.target.tagName !== 'IMG' && !e.target.closest('#lbSvg')) lb.classList.remove('open');
        });
        document.getElementById('lbClose').addEventListener('click', () => lb.classList.remove('open'));
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lb.classList.remove('open'); });

        // --------------------------------------------------------------
        //  MOTEUR DE RENDU
        // --------------------------------------------------------------
        const grid = document.getElementById('gridContainer');
        const titleEl = document.getElementById('sectionTitle');
        const descEl = document.getElementById('sectionDesc');
        const countBadge = document.getElementById('countBadge');
        const navLinks = document.querySelectorAll('#nav a');
        let currentSection = 'phyllotaxy';

        function render(sectionKey) {
            const section = data[sectionKey];
            if (!section) return;

            currentSection = sectionKey;
            titleEl.textContent = section.title;
            descEl.textContent = section.desc;
            countBadge.textContent = section.cards.length + ' termes';

            // surligner la navigation
            navLinks.forEach(a => {
                a.classList.toggle('active', a.dataset.section === sectionKey);
            });

            // construire les cartes
            grid.innerHTML = '';
            section.cards.forEach(c => {
                const slug = slugify(c.term);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
              <div class="term">${c.term}</div>
              <div class="def">${c.def}</div>
              <div class="media-label">Schéma</div>
              <div class="svg-wrap">${c.svg}</div>
              <div class="media-label">Photo réelle</div>
              <div class="photo-area"></div>
              <span class="tag">${section.title}</span>
            `;
                grid.appendChild(card);
                const sw = card.querySelector('.svg-wrap');
                if (sw) sw.addEventListener('click', () => openLightboxSVG(c.svg));
                const area = card.querySelector('.photo-area');
                setupPhotos(area, slug);
            });
        }

        // --------------------------------------------------------------
        //  NAVIGATION
        // --------------------------------------------------------------
        navLinks.forEach(a => {
            a.addEventListener('click', (e) => {
                e.preventDefault();
                const key = a.dataset.section;
                render(key);
                document.getElementById('sidebar').classList.remove('open');
            });
        });

        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });

        // --------------------------------------------------------------
        //  INIT
        // --------------------------------------------------------------
        render('phyllotaxy');
    </script>
</body>
</html>
