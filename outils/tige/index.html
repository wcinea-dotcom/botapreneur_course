<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Identification des tiges – Schémas & Photos</title>
    <style>
        *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; background: #f4f0ea; color: #2d2a24; display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: #3a4656; color: #e3ebf2; padding: 1.8rem 1.2rem; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; box-shadow: 2px 0 12px rgba(0,0,0,0.15); transition: transform 0.3s ease; }
        .sidebar h1 { font-size: 1.3rem; font-weight: 500; letter-spacing: 0.03em; border-bottom: 2px solid #5a6b7e; padding-bottom: 0.8rem; margin-bottom: 1.5rem; color: #d5e0ea; }
        .sidebar h1 small { display: block; font-size: 0.7rem; font-weight: 300; color: #a6b8c9; margin-top: 0.2rem; }
        .sidebar nav { display: flex; flex-direction: column; gap: 0.2rem; }
        .sidebar nav a { color: #d5e0ea; text-decoration: none; padding: 0.45rem 0.8rem; border-radius: 6px; font-size: 0.88rem; transition: background 0.2s, color 0.2s; border-left: 3px solid transparent; cursor: pointer; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #48586b; color: #fff; border-left-color: #8fb0c9; }
        .sidebar nav .cat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8397a9; padding: 0.8rem 0.8rem 0.2rem; font-weight: 600; }
        .main { margin-left: 280px; flex: 1; padding: 2rem 2.5rem 4rem; max-width: 1300px; }
        .main header { margin-bottom: 2.5rem; }
        .main header h2 { font-size: 2rem; font-weight: 400; color: #3a4656; letter-spacing: -0.01em; }
        .main header p { color: #5f5a52; font-size: 1.05rem; margin-top: 0.3rem; }
        .main header .badge-count { font-size: 0.8rem; background: #e6ebf0; color: #3a4656; padding: 0.15rem 0.9rem; border-radius: 20px; display: inline-block; margin-top: 0.3rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.8rem; }
        .card { background: #fffcf9; border-radius: 16px; padding: 1.2rem 1.2rem 1.4rem; box-shadow: 0 4px 14px rgba(0,0,0,0.04); transition: box-shadow 0.2s; border: 1px solid #e4ddd4; display: flex; flex-direction: column; }
        .card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.07); }
        .card .term { font-weight: 600; font-size: 1.1rem; color: #26303c; margin-bottom: 0.2rem; }
        .card .term small { font-weight: 400; font-size: 0.75rem; color: #6a747e; margin-left: 0.4rem; }
        .card .def { font-size: 0.88rem; color: #3f3a32; margin: 0.3rem 0 0.7rem; line-height: 1.5; flex: 0 0 auto; }
        .card .svg-wrap { display: flex; align-items: center; justify-content: center; min-height: 100px; background: #fcf9f5; border-radius: 10px; border: 1px solid #eae3d9; padding: 0.3rem; cursor: zoom-in; }
        .card .svg-wrap svg { display: block; width: 100%; height: auto; max-height: 160px; }
        .card .tag { display: inline-block; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; background: #e6ebf0; color: #3a4656; padding: 0.1rem 0.6rem; border-radius: 12px; margin-top: 0.6rem; align-self: flex-start; }
        .card .media-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: #8fa0b0; font-weight: 600; margin: 0.55rem 0 0.2rem; }
        .photo-area { display: flex; flex-direction: column; align-items: center; gap: 7px; }
        .photo-add { cursor: pointer; font-size: 0.74rem; color: #3a4656; background: #e6ebf0; border: 1px dashed #a3b4c2; border-radius: 9px; padding: 0.5rem 0.7rem; text-align: center; width: 100%; transition: background 0.15s; }
        .photo-add:hover { background: #d8e0e8; }
        .photo-thumb { position: relative; }
        .photo-thumb .rm { position: absolute; top: -6px; right: -6px; background: #c0523f; color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; line-height: 16px; padding: 0; cursor: pointer; display: none; }
        .photo-thumb:hover .rm { display: block; }
        .photo-gallery { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
        .photo-gallery img { width: 64px; height: 64px; object-fit: cover; border-radius: 7px; cursor: zoom-in; border: 1px solid #e4ddd4; transition: transform 0.15s; }
        .photo-gallery img:hover { transform: scale(1.06); }
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 2rem; }
        .lightbox.open { display: flex; }
        .lightbox img { max-width: 92%; max-height: 92%; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .lightbox .lb-svg { display: none; background: #fffdf9; border-radius: 12px; padding: 26px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .lightbox .lb-svg svg { width: min(70vw, 560px); height: auto; display: block; }
        .lightbox .close { position: absolute; top: 1rem; right: 1.6rem; color: #fff; font-size: 2.4rem; line-height: 1; cursor: pointer; }
        @media (max-width: 820px) {
            .sidebar { transform: translateX(-100%); width: 260px; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 1.2rem 1rem; }
            .menu-toggle { display: inline-block; background: #3a4656; color: #fff; border: none; padding: 0.4rem 1.2rem; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; cursor: pointer; }
            .grid { grid-template-columns: 1fr; }
        }
        @media (min-width: 821px) { .menu-toggle { display: none; } }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: #28313d; }
        .sidebar::-webkit-scrollbar-thumb { background: #5a6b7e; border-radius: 4px; }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <h1>🌳 Identification des tiges <small>Schémas &amp; photos réelles</small></h1>
        <nav id="nav">
            <div class="cat-label">Port &amp; consistance</div>
            <a data-section="habit" class="active">Port de la tige</a>

            <div class="cat-label">Forme</div>
            <a data-section="form">Forme (coupe)</a>

            <div class="cat-label">Tiges transformées</div>
            <a data-section="underground">Tiges souterraines</a>
            <a data-section="modified">Modifiées aériennes</a>
        </nav>
    </aside>

    <main class="main" id="mainContent">
        <button class="menu-toggle" id="menuToggle">☰ Menu</button>
        <header>
            <h2 id="sectionTitle">Port de la tige</h2>
            <p id="sectionDesc">La consistance et le port (direction de croissance) de la tige.</p>
            <span class="badge-count" id="countBadge">0 termes</span>
        </header>
        <div class="grid" id="gridContainer"></div>
    </main>

    <div class="lightbox" id="lightbox">
        <span class="close" id="lbClose">&times;</span>
        <img id="lbImg" alt="Photo agrandie" />
        <div id="lbSvg" class="lb-svg"></div>
    </div>

    <script>
        // Palette : tige verte (herbacée), bois brun, racine beige, sol pointillé.
        const SG = '#6f8a5a';   // tige verte
        const SGS = '#4a6a3a';  // contour tige verte
        const WD = '#a9825a';   // bois
        const WDS = '#6a4a2a';  // contour bois
        const RT = '#c9a86a';   // racine
        const DK = '#4a3a2a';   // nœud / sombre
        const SOIL = '#b7a98a'; // ligne de sol
        function ground(y) { return `<line x1="8" y1="${y}" x2="192" y2="${y}" stroke="${SOIL}" stroke-width="2" stroke-dasharray="6,4"/>`; }

        const data = {

            // ─── PORT & CONSISTANCE ─────────────────────────────────────
            habit: {
                title: 'Port de la tige',
                desc: 'La consistance de la tige et sa direction de croissance.',
                cards: [
                    { term: 'Herbacée <small>(Herbaceous)</small>', def: 'Tige tendre, verte et souple, non lignifiée (la plupart des plantes annuelles).',
                      svg: `<svg viewBox="0 0 200 140"><path d="M100,128 Q92,80 100,18" fill="none" stroke="${SG}" stroke-width="7" stroke-linecap="round"/><path d="M100,60 Q120,50 132,58 M100,90 Q80,80 68,88" fill="none" stroke="${SG}" stroke-width="3"/></svg>` },
                    { term: 'Ligneuse <small>(Woody)</small>', def: 'Tige dure et lignifiée, formant du bois (arbres, arbustes).',
                      svg: `<svg viewBox="0 0 200 140"><path d="M88,130 L92,40 Q100,26 108,40 L112,130Z" fill="${WD}" stroke="${WDS}" stroke-width="2"/><path d="M96,60 L70,34 M104,66 L134,44" stroke="${WDS}" stroke-width="4" stroke-linecap="round"/><path d="M99,50 L99,120 M104,55 L104,120" stroke="${WDS}" stroke-width="0.8" opacity="0.6"/></svg>` },
                    { term: 'Dressée <small>(Erect)</small>', def: 'Tige poussant verticalement, droite vers le haut.',
                      svg: `<svg viewBox="0 0 200 140">${ground(126)}<line x1="100" y1="126" x2="100" y2="20" stroke="${SG}" stroke-width="6" stroke-linecap="round"/></svg>` },
                    { term: 'Ascendante <small>(Ascending)</small>', def: 'Tige d’abord couchée à la base, puis se redressant vers le haut.',
                      svg: `<svg viewBox="0 0 200 140">${ground(122)}<path d="M40,120 Q90,120 110,80 Q122,50 120,22" fill="none" stroke="${SG}" stroke-width="6" stroke-linecap="round"/></svg>` },
                    { term: 'Décombante <small>(Decumbent)</small>', def: 'Tige couchée sur le sol, mais dont seule l’extrémité se relève.',
                      svg: `<svg viewBox="0 0 200 140">${ground(120)}<path d="M28,116 Q100,124 150,110 Q168,104 170,80" fill="none" stroke="${SG}" stroke-width="6" stroke-linecap="round"/></svg>` },
                    { term: 'Rampante <small>(Prostrate / Creeping)</small>', def: 'Tige couchée à plat sur le sol, s’enracinant souvent aux nœuds.',
                      svg: `<svg viewBox="0 0 200 140">${ground(96)}<path d="M20,92 Q100,104 180,92" fill="none" stroke="${SG}" stroke-width="6" stroke-linecap="round"/><g stroke="${RT}" stroke-width="2"><path d="M60,98 L58,120 M62,98 L66,118"/><path d="M120,100 L118,122 M124,100 L128,120"/></g><path d="M60,90 L58,72 M120,92 L122,74" stroke="${SG}" stroke-width="3"/></svg>` },
                    { term: 'Volubile <small>(Twining)</small>', def: 'Tige grimpante qui s’enroule en spirale autour d’un support (liseron, haricot).',
                      svg: `<svg viewBox="0 0 200 140"><line x1="100" y1="12" x2="100" y2="130" stroke="${DK}" stroke-width="6" opacity="0.35"/><path d="M100,128 C70,116 70,104 100,96 C130,88 130,76 100,68 C70,60 70,48 100,40 C130,32 130,22 100,16" fill="none" stroke="${SG}" stroke-width="5" stroke-linecap="round"/></svg>` },
                    { term: 'Grimpante à vrilles <small>(Climbing)</small>', def: 'Tige grimpant à l’aide de vrilles ou de crampons qui s’accrochent au support.',
                      svg: `<svg viewBox="0 0 200 140"><line x1="60" y1="14" x2="60" y2="130" stroke="${DK}" stroke-width="6" opacity="0.35"/><path d="M64,128 Q100,110 96,80 Q92,52 110,36" fill="none" stroke="${SG}" stroke-width="5" stroke-linecap="round"/><path d="M96,80 Q78,74 64,80 Q54,86 62,72" fill="none" stroke="${SGS}" stroke-width="2.5"/><path d="M100,58 Q118,52 132,58 Q142,64 134,50" fill="none" stroke="${SGS}" stroke-width="2.5"/></svg>` }
                ]
            },

            // ─── FORME (COUPE) ──────────────────────────────────────────
            form: {
                title: 'Forme de la tige (coupe)',
                desc: 'La forme de la tige vue en coupe transversale.',
                cards: [
                    { term: 'Cylindrique <small>(Terete)</small>', def: 'Section circulaire, tige ronde (le cas le plus courant).',
                      svg: `<svg viewBox="0 0 200 140"><circle cx="100" cy="70" r="42" fill="${SG}" stroke="${SGS}" stroke-width="2"/><circle cx="100" cy="70" r="14" fill="#fff" opacity="0.5"/></svg>` },
                    { term: 'Quadrangulaire <small>(Quadrangular)</small>', def: 'Section carrée, tige à quatre angles (typique des Lamiacées : menthe, sauge).',
                      svg: `<svg viewBox="0 0 200 140"><rect x="62" y="32" width="76" height="76" rx="8" fill="${SG}" stroke="${SGS}" stroke-width="2"/></svg>` },
                    { term: 'Triangulaire <small>(Triangular)</small>', def: 'Section en triangle, tige à trois angles (typique des Cypéracées : souchets).',
                      svg: `<svg viewBox="0 0 200 140"><path d="M100,30 L142,108 L58,108 Z" fill="${SG}" stroke="${SGS}" stroke-width="2" stroke-linejoin="round"/></svg>` },
                    { term: 'Aplatie <small>(Flattened)</small>', def: 'Tige comprimée, aplatie dans un sens (parfois foliacée).',
                      svg: `<svg viewBox="0 0 200 140"><ellipse cx="100" cy="70" rx="52" ry="20" fill="${SG}" stroke="${SGS}" stroke-width="2"/></svg>` },
                    { term: 'Ailée <small>(Winged)</small>', def: 'Tige portant des crêtes membraneuses (ailes) longitudinales.',
                      svg: `<svg viewBox="0 0 200 140"><circle cx="100" cy="70" r="26" fill="${SG}" stroke="${SGS}" stroke-width="2"/><path d="M100,44 L100,20 M100,96 L100,120 M74,70 L48,70 M126,70 L152,70" stroke="${SG}" stroke-width="9" stroke-linecap="round"/></svg>` },
                    { term: 'Cannelée <small>(Sulcate / Grooved)</small>', def: 'Tige marquée de sillons et de côtes longitudinaux.',
                      svg: `<svg viewBox="0 0 200 140"><circle cx="100" cy="70" r="42" fill="${SG}" stroke="${SGS}" stroke-width="2"/><g stroke="${SGS}" stroke-width="2" fill="none">${Array.from({length:10}).map((_,i)=>{var a=i*Math.PI/5;return `<line x1="${(100+30*Math.cos(a)).toFixed(1)}" y1="${(70+30*Math.sin(a)).toFixed(1)}" x2="${(100+42*Math.cos(a)).toFixed(1)}" y2="${(70+42*Math.sin(a)).toFixed(1)}"/>`}).join('')}</g></svg>` }
                ]
            },

            // ─── TIGES SOUTERRAINES ─────────────────────────────────────
            underground: {
                title: 'Tiges souterraines',
                desc: 'Tiges modifiées vivant sous terre, souvent organes de réserve ou de multiplication.',
                cards: [
                    { term: 'Rhizome <small>(Rhizome)</small>', def: 'Tige horizontale souterraine, à nœuds ; émet des racines dessous et des pousses dessus (gingembre, bambou).',
                      svg: `<svg viewBox="0 0 200 140">${ground(64)}<path d="M28,92 Q100,80 172,92" fill="none" stroke="${WD}" stroke-width="14" stroke-linecap="round"/><g fill="${DK}"><circle cx="70" cy="85" r="3"/><circle cx="128" cy="85" r="3"/></g><g stroke="${SG}" stroke-width="4"><path d="M70,80 L70,40"/><path d="M128,80 L128,40"/></g><g stroke="${RT}" stroke-width="2"><path d="M50,98 L46,118 M100,100 L100,120 M150,98 L154,116"/></g></svg>` },
                    { term: 'Tubercule <small>(Tuber)</small>', def: 'Extrémité de tige souterraine renflée par des réserves ; porte des « yeux » (bourgeons), comme la pomme de terre.',
                      svg: `<svg viewBox="0 0 200 140">${ground(38)}<path d="M62,60 Q60,52 74,52 L120,50 Q150,60 148,86 Q142,112 104,114 Q64,112 58,86 Q54,66 62,60Z" fill="${WD}" stroke="${WDS}" stroke-width="2"/><path d="M110,50 L110,34" stroke="${SG}" stroke-width="4"/><g fill="${DK}"><circle cx="86" cy="72" r="3"/><circle cx="112" cy="66" r="3"/><circle cx="120" cy="92" r="3"/><circle cx="92" cy="98" r="3"/></g></svg>` },
                    { term: 'Bulbe <small>(Bulb)</small>', def: 'Bourgeon souterrain formé de feuilles épaisses (écailles) empilées sur un plateau court (oignon, tulipe).',
                      svg: `<svg viewBox="0 0 200 140">${ground(40)}<path d="M100,24 L100,44" stroke="${SG}" stroke-width="4"/><path d="M64,60 Q64,112 100,116 Q136,112 136,60 Q100,50 64,60Z" fill="#eadfae" stroke="${WDS}" stroke-width="1.8"/><g fill="none" stroke="${WDS}" stroke-width="1.2"><path d="M74,64 Q74,104 100,110 Q126,104 126,64"/><path d="M84,66 Q84,98 100,104 Q116,98 116,66"/></g><path d="M100,54 L100,110" stroke="${WDS}" stroke-width="1"/><g stroke="${RT}" stroke-width="2"><path d="M90,116 L88,132 M100,118 L100,134 M110,116 L112,132"/></g></svg>` },
                    { term: 'Corme / Bulbe solide <small>(Corm)</small>', def: 'Base de tige souterraine renflée et pleine (non feuilletée), entourée de fines tuniques (glaïeul, safran).',
                      svg: `<svg viewBox="0 0 200 140">${ground(42)}<path d="M100,24 L100,46" stroke="${SG}" stroke-width="4"/><path d="M66,62 Q66,110 100,114 Q134,110 134,62 Q100,52 66,62Z" fill="${WD}" stroke="${WDS}" stroke-width="2"/><path d="M66,62 Q100,54 134,62" fill="none" stroke="${WDS}" stroke-width="1" stroke-dasharray="3,3"/><g fill="${DK}"><circle cx="100" cy="60" r="3"/></g><g stroke="${RT}" stroke-width="2"><path d="M88,114 L86,130 M100,116 L100,132 M112,114 L114,130"/></g></svg>` },
                    { term: 'Stolon <small>(Stolon / Runner)</small>', def: 'Tige rampante (souvent à la surface) qui s’enracine à distance et forme un nouveau plant (fraisier).',
                      svg: `<svg viewBox="0 0 200 140">${ground(100)}<path d="M34,80 Q40,96 60,96 Q120,96 150,92" fill="none" stroke="${SG}" stroke-width="5" stroke-linecap="round"/><path d="M150,92 Q160,84 158,66" fill="none" stroke="${SG}" stroke-width="4"/><path d="M158,66 Q142,58 150,50 M158,66 Q174,58 166,50" fill="${SG}" stroke="${SGS}" stroke-width="1.5"/><g stroke="${RT}" stroke-width="2"><path d="M152,98 L150,116 M158,98 L160,116"/></g><path d="M40,74 Q30,66 36,58 M40,74 Q50,66 44,58" fill="${SG}" stroke="${SGS}" stroke-width="1.5"/></svg>` }
                ]
            },

            // ─── MODIFIÉES AÉRIENNES ────────────────────────────────────
            modified: {
                title: 'Tiges modifiées aériennes',
                desc: 'Tiges aériennes transformées pour une fonction particulière.',
                cards: [
                    { term: 'Cladode <small>(Cladode)</small>', def: 'Tige aplatie et verte qui remplace la feuille pour la photosynthèse (raquette du figuier de Barbarie, Ruscus).',
                      svg: `<svg viewBox="0 0 200 140"><line x1="100" y1="130" x2="100" y2="108" stroke="${WD}" stroke-width="4"/><ellipse cx="100" cy="66" rx="34" ry="46" fill="${SG}" stroke="${SGS}" stroke-width="2"/><g fill="${DK}"><circle cx="84" cy="46" r="2.5"/><circle cx="116" cy="52" r="2.5"/><circle cx="90" cy="80" r="2.5"/><circle cx="112" cy="86" r="2.5"/><circle cx="100" cy="66" r="2.5"/></g></svg>` },
                    { term: 'Vrille caulinaire <small>(Stem tendril)</small>', def: 'Tige (ou rameau) transformée en un filament enroulé qui s’accroche à un support (vigne, passiflore).',
                      svg: `<svg viewBox="0 0 200 140"><path d="M40,128 Q60,90 60,70" fill="none" stroke="${SG}" stroke-width="5" stroke-linecap="round"/><path d="M60,70 Q80,64 82,80 Q84,98 104,96 Q124,94 118,76 Q114,60 130,54 Q146,48 140,64" fill="none" stroke="${SG}" stroke-width="3.5" stroke-linecap="round"/></svg>` },
                    { term: 'Épine caulinaire <small>(Thorn)</small>', def: 'Rameau transformé en pointe dure et ligneuse, servant de défense (aubépine, prunellier, Bougainvillier).',
                      svg: `<svg viewBox="0 0 200 140"><path d="M40,120 Q90,100 150,92" fill="none" stroke="${WD}" stroke-width="6" stroke-linecap="round"/><path d="M96,104 L128,44" stroke="${WDS}" stroke-width="5" stroke-linecap="round"/><path d="M78,110 L58,70" stroke="${WDS}" stroke-width="4" stroke-linecap="round"/></svg>` },
                    { term: 'Bulbille <small>(Bulbil)</small>', def: 'Petit bulbe (ou tubercule) aérien né à l’aisselle d’une feuille ou dans l’inflorescence, servant à se multiplier (ail, certaines fougères).',
                      svg: `<svg viewBox="0 0 200 140"><line x1="100" y1="130" x2="100" y2="14" stroke="${SG}" stroke-width="5"/><path d="M100,70 Q126,60 140,68" fill="none" stroke="${SG}" stroke-width="3"/><g><circle cx="120" cy="86" r="12" fill="${WD}" stroke="${WDS}" stroke-width="1.6"/><path d="M120,74 L120,98 M112,78 Q120,74 128,78" fill="none" stroke="${WDS}" stroke-width="1"/></g><circle cx="82" cy="52" r="9" fill="${WD}" stroke="${WDS}" stroke-width="1.5"/></svg>` }
                ]
            }

        };

        function slugify(term) { var t = term.replace(/<[^>]*>/g, ''); var m = t.match(/\(([^)]+)\)/); if (m) t = m[1].split('/')[0]; return t.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }

        let _db;
        function openDB() { return new Promise((res, rej) => { if (_db) return res(_db); const r = indexedDB.open('stemPhotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => { _db = r.result; res(_db); }; r.onerror = () => rej(r.error); }); }
        async function getStored(slug) { try { const d = await openDB(); return await new Promise(res => { const q = d.transaction('photos','readonly').objectStore('photos').get(slug); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); } catch (e) { return []; } }
        async function setStored(slug, arr) { try { const d = await openDB(); await new Promise(res => { const q = d.transaction('photos','readwrite').objectStore('photos').put(arr, slug); q.onsuccess = () => res(); q.onerror = () => res(); }); } catch (e) {} }
        function fileToDataURL(file, maxDim, quality) { maxDim = maxDim || 1400; quality = quality || 0.85; return new Promise(res => { const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => { let w = img.width, h = img.height; if (Math.max(w, h) > maxDim) { const s = maxDim / Math.max(w, h); w = Math.round(w*s); h = Math.round(h*s); } const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); try { res(c.toDataURL('image/jpeg', quality)); } catch (e) { res(fr.result); } }; img.onerror = () => res(fr.result); img.src = fr.result; }; fr.readAsDataURL(file); }); }
        function setupPhotos(area, slug) {
            const gallery = document.createElement('div'); gallery.className = 'photo-gallery';
            const add = document.createElement('label'); add.className = 'photo-add'; add.innerHTML = '＋ Ajouter une photo';
            const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; inp.style.display = 'none';
            add.appendChild(inp); area.appendChild(gallery); area.appendChild(add);
            let stored = [];
            function drawThumb(src, removable, idx) { const wrap = document.createElement('div'); wrap.className = 'photo-thumb'; const im = document.createElement('img'); im.src = src; im.loading = 'lazy'; im.addEventListener('click', () => openLightbox(src)); wrap.appendChild(im); if (removable) { const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '×'; rm.title = 'Retirer'; rm.addEventListener('click', async (e) => { e.stopPropagation(); stored.splice(idx, 1); await setStored(slug, stored); renderAll(); }); wrap.appendChild(rm); } gallery.appendChild(wrap); }
            function renderAll() { gallery.innerHTML = ''; stored.forEach((src, idx) => drawThumb(src, true, idx)); ['jpg','jpeg','png','webp'].forEach(ext => { const url = 'images/' + slug + '.' + ext; const t = new Image(); t.onload = () => drawThumb(url, false); t.src = url; }); }
            renderAll();
            getStored(slug).then(arr => { if (arr && arr.length) { stored = arr; renderAll(); } }).catch(() => {});
            inp.addEventListener('change', async () => { for (const file of inp.files) { const d = await fileToDataURL(file); stored.push(d); } await setStored(slug, stored); inp.value = ''; renderAll(); });
        }

        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lbImg');
        const lbSvg = document.getElementById('lbSvg');
        function openLightbox(src) { lbSvg.style.display = 'none'; lbSvg.innerHTML = ''; lbImg.style.display = 'block'; lbImg.src = src; lb.classList.add('open'); }
        function openLightboxSVG(html) { lbImg.style.display = 'none'; lbImg.removeAttribute('src'); lbSvg.innerHTML = html; lbSvg.style.display = 'block'; lb.classList.add('open'); }
        lb.addEventListener('click', (e) => { if (e.target.tagName !== 'IMG' && !e.target.closest('#lbSvg')) lb.classList.remove('open'); });
        document.getElementById('lbClose').addEventListener('click', () => lb.classList.remove('open'));
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lb.classList.remove('open'); });

        const grid = document.getElementById('gridContainer');
        const titleEl = document.getElementById('sectionTitle');
        const descEl = document.getElementById('sectionDesc');
        const countBadge = document.getElementById('countBadge');
        const navLinks = document.querySelectorAll('#nav a');
        function render(sectionKey) {
            const section = data[sectionKey]; if (!section) return;
            titleEl.innerHTML = section.title; descEl.innerHTML = section.desc; countBadge.textContent = section.cards.length + ' termes';
            navLinks.forEach(a => a.classList.toggle('active', a.dataset.section === sectionKey));
            grid.innerHTML = '';
            section.cards.forEach(c => {
                const slug = slugify(c.term);
                const card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `<div class="term">${c.term}</div><div class="def">${c.def}</div><div class="media-label">Schéma</div><div class="svg-wrap">${c.svg}</div><div class="media-label">Photo réelle</div><div class="photo-area"></div><span class="tag">${section.title}</span>`;
                grid.appendChild(card);
                const sw = card.querySelector('.svg-wrap');
                if (sw) sw.addEventListener('click', () => openLightboxSVG(c.svg));
                setupPhotos(card.querySelector('.photo-area'), slug);
            });
        }
        navLinks.forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); render(a.dataset.section); document.getElementById('sidebar').classList.remove('open'); }));
        document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
        render('habit');
    </script>
</body>
</html>
