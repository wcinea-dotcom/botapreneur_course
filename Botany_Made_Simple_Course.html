<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Botany Made Simple — Botapreneurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
 --green:#2E7D32; --blue:#003366; --orange:#F47C20; --beige:#F8F8F4; --sky:#E6F0F8; --sage:#E0E8DD;
 --ink:#2B2B2B; --grey:#5a6b62; --line:#e2e8e4; --white:#fff;
 --head:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif;
 --body:'Lato',-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--beige);line-height:1.6;font-size:17px}
h1,h2,h3,h4,.head{font-family:var(--head);line-height:1.25}
img,svg{max-width:100%}
/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.brand{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.5px;display:flex;align-items:baseline;gap:6px}
.brand .b1{color:#fff}.brand .b2{color:#8fd39a}
.brand small{font-family:var(--body);font-weight:400;font-size:10px;color:#F47C20;display:block}
.langs{display:flex;gap:4px}
.langs button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-family:var(--head);font-weight:600;font-size:12px;border-radius:16px;padding:5px 10px;cursor:pointer}
.langs button.on{background:var(--orange);border-color:var(--orange)}
.progress{position:sticky;top:52px;z-index:29;height:4px;background:#dfe7e2}
.progress>i{display:block;height:100%;width:0;background:var(--green);transition:width .1s}
/* nav chips */
.nav{position:sticky;top:56px;z-index:28;background:var(--beige);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:9px 12px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;font-family:var(--head);font-weight:600;font-size:13px;color:var(--blue);background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 13px;text-decoration:none;white-space:nowrap}
.nav a.active{background:var(--green);color:#fff;border-color:var(--green)}
/* layout */
.wrap{max-width:820px;margin:0 auto;padding:0 16px 60px}
section{padding:26px 0;border-bottom:1px solid var(--line)}
.kicker{font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
h1.title{font-size:34px;color:var(--blue);margin:.1em 0 .2em}
h2.mtitle{font-size:26px;color:var(--blue);margin:.1em 0 .15em}
.sub{font-family:var(--head);font-weight:500;color:var(--grey);font-size:17px;margin:0 0 14px}
h3.sh{font-size:20px;color:var(--green);margin:22px 0 6px}
p{margin:0 0 14px}
.lead{font-size:19px}
/* hero */
.hero{background:linear-gradient(160deg,#003366,#0a4f7a);color:#fff;border-radius:18px;padding:30px 22px;margin:22px 0}
.hero .kicker{color:#ffd9b3}
.hero h1{color:#fff;font-size:32px;margin:.1em 0 .3em}
.hero p{color:#e7eef5;font-size:18px}
.hero .cta{margin-top:14px}
.btn{display:inline-block;background:var(--orange);color:#fff;font-family:var(--head);font-weight:600;text-decoration:none;border:none;border-radius:26px;padding:13px 24px;font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(244,124,32,.35)}
.btn.ghost{background:transparent;border:2px solid #fff}
.btn:active{transform:translateY(1px)}
/* cards */
.cards{display:grid;grid-template-columns:1fr;gap:14px;margin:12px 0}
@media(min-width:640px){.cards.c3{grid-template-columns:1fr 1fr 1fr}.cards.c2{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 16px;border-top:4px solid var(--green)}
.card.blue{border-top-color:var(--blue)}.card.orange{border-top-color:var(--orange)}
.card .n{font-family:var(--head);font-weight:700;color:var(--green);font-size:14px}
.card h4{font-size:17px;color:var(--blue);margin:4px 0 6px}
.card p{font-size:15px;color:var(--ink);margin:0}
/* objectives / lists */
.obj{background:var(--sage);border-radius:12px;padding:14px 16px;margin:10px 0 6px}
.obj b{font-family:var(--head);color:var(--green);font-size:14px;text-transform:uppercase;letter-spacing:.5px}
ul.clean{margin:8px 0 0;padding-left:20px}ul.clean li{margin:6px 0}
/* key terms + tip */
.terms{background:#fff;border:1px dashed #bcd6c4;border-radius:12px;padding:12px 14px;margin:16px 0;font-size:15px}
.terms b{font-family:var(--head);color:var(--green)}
.termchip{display:inline-block;background:var(--sage);border-radius:14px;padding:3px 10px;margin:3px 4px 0 0;font-size:14px}
.tip{background:var(--sky);border-left:5px solid var(--orange);border-radius:10px;padding:14px 16px;margin:16px 0;font-size:16px}
.tip b{font-family:var(--head);color:var(--blue)}
.review{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0}
.review b{font-family:var(--head);color:var(--green);font-size:14px;text-transform:uppercase;letter-spacing:.5px}
.practice{background:#eaf5ec;border:1px solid #bfe0c8;border-left:5px solid var(--green);border-radius:10px;padding:14px 16px;margin:16px 0}
.practice b{font-family:var(--head);color:var(--green);display:block;margin-bottom:4px}
.practice p{margin:0;font-size:16px}
.capbox{background:#fff;border:2px solid var(--green);border-radius:16px;padding:22px;margin:18px 0}
.capbox .kicker{color:var(--green)}
.capbox h2{font-size:24px;color:var(--blue);margin:.1em 0 .4em}
.capbox ol{margin:10px 0 0;padding-left:22px}.capbox ol li{margin:8px 0;font-size:16px}
.capbox .keep{margin-top:14px;font-style:italic;color:var(--grey)}
/* visuals */
.figure{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0}
.figure .cap{font-family:var(--head);font-weight:600;color:var(--blue);font-size:15px;margin-bottom:10px;text-align:center}
/* vocab */
.vocab{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
@media(min-width:560px){.vocab{grid-template-columns:1fr 1fr}}
.vitem{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vitem .vh{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.vitem .vh svg{width:46px;height:46px;flex:none}
.vitem .vh .vt{font-family:var(--head);font-weight:600;color:var(--blue);font-size:16px}
.vitem .vh .vt small{display:block;font-family:var(--body);font-weight:400;color:var(--grey);font-size:12px}
.vitem .vd{max-height:0;overflow:hidden;transition:max-height .25s ease;padding:0 14px}
.vitem.open .vd{max-height:320px;padding:0 14px 14px}
.vitem .vd p{font-size:15px;margin:0}
.chev{margin-left:auto;color:var(--green);font-weight:700}
/* module footer nav */
.mfoot{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.mfoot a{font-family:var(--head);font-weight:600;font-size:14px;text-decoration:none;color:var(--blue);background:#fff;border:1px solid var(--line);border-radius:22px;padding:10px 16px}
.mfoot a.next{background:var(--green);color:#fff;border-color:var(--green)}
/* completion */
.done{background:linear-gradient(160deg,#2E7D32,#1c5a22);color:#fff;border-radius:18px;padding:30px 22px;text-align:center;margin:22px 0}
.done h2{color:#fff;font-size:28px;margin:.1em 0 .3em}
.done p{color:#e6f2e8;font-size:17px}
.done .btn{margin-top:12px;font-size:18px}
.done .note{font-size:13px;color:#cfe6d3;margin-top:14px}
.footer{text-align:center;color:var(--grey);font-size:13px;padding:26px 0 0}
</style>
