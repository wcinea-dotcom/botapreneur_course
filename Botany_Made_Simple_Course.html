/* ---------- SVG pattern diagrams ---------- */
function svgTree(V){
 return `<svg viewBox="0 0 640 300" role="img">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#003366"/></marker></defs>
  <line x1="40" y1="250" x2="600" y2="250" stroke="#c9d8cf" stroke-width="2"/>
  ${[["life",70],["land",190],["transport",310],["seed",430],["flower",545]].map(([k,x],i)=>`
    <line x1="${x}" y1="250" x2="${x}" y2="90" stroke="#8fbf9a" stroke-width="2"/>
    <circle cx="${x}" cy="90" r="16" fill="#2E7D32"/>
    <text x="${x}" y="95" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">${i+1}</text>
    <text x="${x}" y="72" text-anchor="middle" fill="#003366" font-size="12" font-weight="700" font-family="Poppins,sans-serif">${V.steps[k]}</text>
  `).join("")}
  <line x1="40" y1="250" x2="595" y2="250" stroke="#003366" stroke-width="2" marker-end="url(#ar)"/>
  ${[["algae",70],["bryo",165],["fern",290],["gymno",430],["angio",560]].map(([k,x])=>`
    <text x="${x}" y="275" text-anchor="middle" fill="#5a6b62" font-size="11">${V.lin[k]}</text>`).join("")}
  <text x="320" y="295" text-anchor="middle" fill="#2E7D32" font-size="11" font-style="italic">${V.treeFoot}</text>
 </svg>`;
}
function svgMonoEu(V){
 const row=(y,label,a,b)=>`<text x="20" y="${y}" font-size="13" fill="#5a6b62">${label}</text>
   <text x="200" y="${y}" font-size="14" fill="#003366" font-weight="600">${a}</text>
   <text x="430" y="${y}" font-size="14" fill="#003366" font-weight="600">${b}</text>`;
 return `<svg viewBox="0 0 640 250" role="img">
  <rect x="180" y="10" width="220" height="34" rx="8" fill="#E0E8DD"/><text x="290" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#2E7D32" font-family="Poppins,sans-serif">${V.mono}</text>
  <rect x="410" y="10" width="220" height="34" rx="8" fill="#E6F0F8"/><text x="520" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#003366" font-family="Poppins,sans-serif">${V.eudi}</text>
  ${row(80,V.rSeed,V.monoSeed,V.eudiSeed)}
  ${row(120,V.rVein,V.monoVein,V.eudiVein)}
  ${row(160,V.rFlower,V.monoFlower,V.eudiFlower)}
  ${row(200,V.rRoot,V.monoRoot,V.eudiRoot)}
  <line x1="20" y1="55" x2="620" y2="55" stroke="#e2e8e4"/>
 </svg>`;
}
function svgFlower(V){
 return `<svg viewBox="0 0 360 300" role="img">
  <g transform="translate(180,150)">
  ${[0,1,2,3,4].map(i=>{const a=(-90+i*72)*Math.PI/180;return `<ellipse cx="${Math.cos(a)*70}" cy="${Math.sin(a)*70}" rx="34" ry="20" fill="#f6c9de" stroke="#e48fb3" transform="rotate(${i*72} ${Math.cos(a)*70} ${Math.sin(a)*70})"/>`}).join("")}
  ${[0,1,2,3,4].map(i=>{const a=(-90+i*72+36)*Math.PI/180;return `<circle cx="${Math.cos(a)*42}" cy="${Math.sin(a)*42}" r="7" fill="#F4C430" stroke="#c99a12"/>`}).join("")}
  <circle r="20" fill="#2E7D32"/>
  </g>
  <text x="180" y="24" text-anchor="middle" font-size="13" fill="#003366" font-weight="700">${V.petals} · C</text>
  <text x="330" y="150" text-anchor="end" font-size="13" fill="#c99a12" font-weight="700">${V.stamens} · A</text>
  <text x="180" y="160" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">G</text>
  <text x="180" y="292" text-anchor="middle" font-size="13" fill="#2E7D32" font-weight="700">${V.carpels} · G</text>
  <text x="30" y="150" text-anchor="start" font-size="13" fill="#7f9488" font-weight="700">${V.sepals} · K</text>
 </svg>`;
}
function svgLeaf(V){
 const stem=(x,label,fn)=>`<g transform="translate(${x},0)"><line x1="40" y1="20" x2="40" y2="150" stroke="#2E7D32" stroke-width="4"/>${fn}<text x="40" y="175" text-anchor="middle" font-size="13" fill="#003366" font-weight="600">${label}</text></g>`;
 const leaf=(cx,cy,dir)=>`<ellipse cx="${cx+dir*22}" cy="${cy}" rx="22" ry="9" fill="#8fd39a" stroke="#2E7D32" transform="rotate(${dir*-15} ${cx} ${cy})"/>`;
 return `<svg viewBox="0 0 520 200" role="img">
  ${stem(0,V.opposite,leaf(40,60,-1)+leaf(40,60,1)+leaf(40,110,-1)+leaf(40,110,1))}
  ${stem(170,V.alternate,leaf(40,55,-1)+leaf(40,90,1)+leaf(40,125,-1))}
  ${stem(340,V.whorled,leaf(40,80,-1)+leaf(40,80,1)+`<ellipse cx="40" cy="58" rx="9" ry="22" fill="#8fd39a" stroke="#2E7D32"/>`)}
 </svg>`;
}
function svgFruit(V){
 const box=(x,color,label,inner)=>`<g transform="translate(${x},0)"><rect x="0" y="8" width="150" height="150" rx="12" fill="${color}"/>${inner}<text x="75" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#003366">${label}</text></g>`;
 return `<svg viewBox="0 0 470 210" role="img">
  ${box(0,"#efe7d6",V.dry,`<ellipse cx="75" cy="83" rx="55" ry="16" fill="#c9a24b"/><circle cx="45" cy="83" r="6" fill="#8a6d2a"/><circle cx="75" cy="83" r="6" fill="#8a6d2a"/><circle cx="105" cy="83" r="6" fill="#8a6d2a"/><text x="75" y="130" text-anchor="middle" font-size="11" fill="#6b5a2a">${V.dryEx}</text>`)}
  ${box(160,"#f6dfe6",V.fleshy,`<circle cx="75" cy="83" r="46" fill="#e05a7a"/><circle cx="75" cy="83" r="16" fill="#7a2a3a"/><text x="75" y="140" text-anchor="middle" font-size="11" fill="#7a2a3a">${V.fleshyEx}</text>`)}
 </svg>`;
}
function svgAdapt(V){
 return `<svg viewBox="0 0 470 220" role="img">
  <g transform="translate(30,0)"><rect x="30" y="60" width="40" height="120" rx="20" fill="#3f9d54"/><rect x="8" y="90" width="26" height="60" rx="13" fill="#3f9d54"/><rect x="66" y="80" width="26" height="70" rx="13" fill="#3f9d54"/>
   ${[70,95,120,145].map(y=>`<line x1="30" y1="${y}" x2="22" y2="${y-4}" stroke="#1c5a22"/><line x1="70" y1="${y}" x2="78" y2="${y-4}" stroke="#1c5a22"/>`).join("")}
   <text x="50" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#003366">${V.cactus}</text><text x="50" y="216" text-anchor="middle" font-size="11" fill="#5a6b62">${V.dryWorld}</text></g>
  <g transform="translate(250,0)"><ellipse cx="90" cy="150" rx="90" ry="22" fill="#bfe0ee"/><ellipse cx="70" cy="140" rx="52" ry="16" fill="#6cbf7a"/><ellipse cx="120" cy="150" rx="40" ry="12" fill="#8fd39a"/><circle cx="95" cy="130" r="12" fill="#f6c9de"/>
   <text x="90" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#003366">${V.lily}</text><text x="90" y="216" text-anchor="middle" font-size="11" fill="#5a6b62">${V.wetWorld}</text></g>
 </svg>`;
}
const DIAG={tree:svgTree,monoeu:svgMonoEu,flower:svgFlower,leaf:svgLeaf,fruit:svgFruit,adapt:svgAdapt};

/* vocab icons */
function vicon(k){const s=(inner)=>`<svg viewBox="0 0 60 60">${inner}</svg>`;
 switch(k){
  case"moss":return s('<ellipse cx="30" cy="46" rx="24" ry="8" fill="#cfe8d3"/><path d="M18 46 q2-16 4 0 M26 46 q2-20 4 0 M34 46 q2-18 4 0 M42 46 q2-14 4 0" stroke="#2E7D32" stroke-width="3" fill="none"/>');
  case"fern":return s('<path d="M30 54 C30 30 30 14 30 8" stroke="#2E7D32" stroke-width="3" fill="none"/>'+[...Array(6)].map((_,i)=>`<path d="M30 ${48-i*7} q-14 -3 -18 -10 M30 ${48-i*7} q14 -3 18 -10" stroke="#3f9d54" stroke-width="2" fill="none"/>`).join(""));
  case"conifer":return s('<polygon points="30,8 46,50 14,50" fill="#2E7D32"/><rect x="26" y="50" width="8" height="8" fill="#8a5a2a"/><ellipse cx="40" cy="40" rx="5" ry="8" fill="#8a6d2a"/>');
  case"flower":return s([0,1,2,3,4].map(i=>{const a=(-90+i*72)*Math.PI/180;return `<ellipse cx="${30+Math.cos(a)*13}" cy="${30+Math.sin(a)*13}" rx="10" ry="6" fill="#e05a7a" transform="rotate(${i*72} ${30+Math.cos(a)*13} ${30+Math.sin(a)*13})"/>`}).join("")+'<circle cx="30" cy="30" r="7" fill="#F4C430"/>');
  case"vessel":return s('<rect x="20" y="8" width="7" height="44" fill="#6cbf7a"/><rect x="33" y="8" width="7" height="44" fill="#6cbf7a"/><line x1="23" y1="16" x2="23" y2="48" stroke="#1c5a22"/><line x1="36" y1="16" x2="36" y2="48" stroke="#1c5a22"/><path d="M14 30 h6 M40 30 h6" stroke="#003366" stroke-width="2"/>');
  case"seed":return s('<ellipse cx="30" cy="32" rx="16" ry="22" fill="#c9a24b"/><path d="M30 14 C22 24 22 40 30 50" stroke="#7a5a1a" stroke-width="2" fill="none"/><circle cx="30" cy="32" r="5" fill="#7a5a1a"/>');
  default:return s('<circle cx="30" cy="30" r="18" fill="#8fd39a"/>');
 }
}

/* ---------- Render ---------- */
const el=(h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;};
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function render(){
 const D=DATA[LANG];const app=document.getElementById("app");app.innerHTML="";
 document.documentElement.lang=LANG;
 document.getElementById("brandTag").textContent=D.ui.tagline;
 // nav
 const nav=document.getElementById("nav");nav.innerHTML="";
 const navItems=[["intro",D.ui.why]].concat(D.modules.map(m=>["m"+m.num,D.ui.module+" "+m.num])).concat([["capstone",D.ui.capstoneNav],["done",D.ui.finishNav]]);
 navItems.forEach(([id,label])=>{const a=document.createElement("a");a.href="#sec-"+id;a.textContent=label;a.dataset.sec=id;nav.appendChild(a);});
 // lang buttons
 document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));

 // ---- INTRO section ----
 let h="";
 h+=`<section id="sec-intro">
  <div class="hero"><div class="kicker">${esc(D.ui.courseKicker)}</div>
   <h1>${esc(D.hero.title)}</h1><p class="lead">${esc(D.hero.hook)}</p>
   <p style="font-size:15px;opacity:.9">${esc(D.hero.angles)}</p>
   <div class="cta"><a class="btn" href="#sec-m1">${esc(D.ui.start)} →</a></div></div>

  <div class="kicker">${esc(D.ui.why)}</div><h1 class="title">${esc(D.intro.title)}</h1>
  ${D.intro.paras.map((p,i)=>`<p class="${i===0?'lead':''}">${esc(p)}</p>`).join("")}

  <h3 class="sh">${esc(D.angles.title)}</h3>
  <div class="cards c3">${D.angles.items.map((a,i)=>`<div class="card ${i===2?'orange':i===1?'blue':''}"><div class="n">0${i+1}</div><h4>${esc(a.t)}</h4><p>${esc(a.d)}</p></div>`).join("")}</div>

  <h3 class="sh">${esc(D.reasons.title)}</h3>
  <div class="cards c3">${D.reasons.items.map((r,i)=>`<div class="card"><div class="n">${esc(D.ui.reasonWord)} ${i+1}</div><h4>${esc(r.t)}</h4><p>${esc(r.d)}</p></div>`).join("")}</div>
 </section>`;

 // ---- MODULES ----
 D.modules.forEach((m,mi)=>{
  h+=`<section id="sec-m${m.num}">
   <div class="kicker">${esc(D.ui.module)} ${m.num}</div>
   <h2 class="mtitle">${esc(m.title)}</h2>
   <p class="sub">${esc(m.subtitle)}</p>
   <div class="obj"><b>${esc(D.ui.objectives)}</b><ul class="clean">${m.objectives.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>`;

  // Visual vocabulary in module 1
  if(m.num===1 && D.vocab){
   h+=`<h3 class="sh">${esc(D.vocab.title)}</h3><p style="font-size:15px;color:var(--grey)">${esc(D.ui.tapHint)}</p><div class="vocab">`+
   D.vocab.items.map((v,i)=>`<div class="vitem" data-vi="${i}"><div class="vh"><span>${vicon(v.icon)}</span><span class="vt">${esc(v.t)}<small>${esc(v.tag||"")}</small></span><span class="chev">+</span></div><div class="vd"><p>${esc(v.d)}</p></div></div>`).join("")+`</div>`;
  }

  m.sections.forEach(s=>{
   h+=`<h3 class="sh">${esc(s.h)}</h3>`+s.paras.map(x=>`<p>${esc(x)}</p>`).join("");
  });

  // diagrams for this module
  (m.diagrams||[]).forEach(dk=>{
   if(DIAG[dk]){h+=`<div class="figure"><div class="cap">${esc(D.vis.caps[dk]||"")}</div>${DIAG[dk](D.vis)}</div>`;}
  });

  h+=`<div class="terms"><b>${esc(D.ui.keyterms)}:</b> ${m.terms.map(t=>`<span class="termchip">${esc(t)}</span>`).join("")}</div>`;
  h+=`<div class="tip"><b>💡 ${esc(D.ui.tip)} —</b> ${esc(m.tip)}</div>`;
  h+=`<div class="review"><b>${esc(D.ui.review)}</b><ul class="clean">${m.review.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
  if(m.practice){h+=`<div class="practice"><b>🌿 ${esc(D.ui.practice)}</b><p>${esc(m.practice)}</p></div>`;}

  // footer nav
  const prev = mi===0 ? "#sec-intro" : "#sec-m"+D.modules[mi-1].num;
  const next = mi===D.modules.length-1 ? "#sec-capstone" : "#sec-m"+D.modules[mi+1].num;
  h+=`<div class="mfoot"><a href="${prev}">← ${esc(D.ui.prev)}</a><a class="next" href="${next}">${esc(D.ui.next)} →</a></div>`;
  h+=`</section>`;
 });

 // ---- CAPSTONE ----
 if(D.capstone){
  h+=`<section id="sec-capstone"><div class="capbox"><div class="kicker">${esc(D.capstone.kicker)}</div>
   <h2>${esc(D.capstone.title)}</h2><p>${esc(D.capstone.intro)}</p>
   <ol>${D.capstone.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
   <p class="keep">${esc(D.capstone.keep)}</p></div>
   <div class="mfoot"><a href="#sec-m${D.modules[D.modules.length-1].num}">← ${esc(D.ui.prev)}</a><a class="next" href="#sec-done">${esc(D.ui.next)} →</a></div></section>`;
 }

 // ---- COMPLETION ----
 h+=`<section id="sec-done">
   <div class="done"><div class="kicker" style="color:#cdeccf">${esc(D.ui.finishNav)}</div>
   <h2>${esc(D.completion.title)}</h2><p>${esc(D.completion.text)}</p>
   <a class="btn" href="${esc(D.completion.url)}" target="_blank" rel="noopener">${esc(D.completion.btn)} →</a>
   <div class="note">${esc(D.completion.note)}</div></div>
   <div class="footer">${esc(D.ui.brand)} · ${esc(D.ui.tagline)}</div>
 </section>`;

 app.innerHTML=h;

 // vocab accordion
 app.querySelectorAll(".vitem .vh").forEach(vh=>vh.addEventListener("click",()=>{
   const it=vh.parentElement;it.classList.toggle("open");
   vh.querySelector(".chev").textContent=it.classList.contains("open")?"–":"+";
 }));
 window.scrollTo({top:0});
}

/* progress + active nav */
function onScroll(){
 const el=document.documentElement;
 const sc=el.scrollTop||document.body.scrollTop;
 const hgt=el.scrollHeight-el.clientHeight;
 document.getElementById("pbar").style.width=(hgt>0?(sc/hgt*100):0)+"%";
 const secs=[...document.querySelectorAll("section")];
 let cur=secs[0]?secs[0].id:"";
 for(const s of secs){if(s.getBoundingClientRect().top<120)cur=s.id;}
 document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+cur));
 const active=document.querySelector(".nav a.active");if(active)active.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}
document.addEventListener("scroll",onScroll,{passive:true});
document.getElementById("langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;LANG=b.dataset.l;render();});
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("service-worker.js").catch(function(){});});}</script></body>
</html>
