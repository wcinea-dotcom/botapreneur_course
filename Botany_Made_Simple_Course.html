<script>
const DATA = {"en":{"ui":{"brand":"Botapreneurs","tagline":"Where Botany Meets Business","why":"Why Botany","module":"Module","start":"Start the course","courseKicker":"Botany Made Simple · Plant Enthusiasts","objectives":"Learning objectives","keyterms":"Key terms","tip":"Think like a botanist","review":"Check your understanding","next":"Next","prev":"Back","tapHint":"Tap a card to reveal its pattern.","reasonWord":"Reason","finishNav":"Finish","practice":"Try it in nature","capstoneNav":"Capstone"},"hero":{"title":"Botany Made Simple","hook":"Stop memorizing names. Start seeing patterns — and understand the plants that feed us, heal us, and keep the planet alive.","angles":"Botany for your interest · for decision-making · to innovate"},"intro":{"title":"Why Botany — and Why This Course","paras":["Botany is a powerful discipline. It shapes the health of human beings and the health of the planet. The food we eat and the energy we live on begin with plants, and plants are the first step toward a better environment for life.","Botany is a living university. It is taught not only in schools, but in nature, in the family, and in everyday life — everywhere plants touch us.","Yet for a long time, botany was taught in a complicated way. People were asked to memorize scientific names without ever understanding the relationships between plants, or the patterns that connect them. Knowledge without understanding is quickly forgotten.","This course has a bigger goal: to raise botany to the place it deserves — at the center of better decisions — and to make it simple, practical and alive. Not to memorize, but to go into nature; to read patterns; to understand ecosystems and uses; and to feel more connected — for your well-being, your innovation, and your interest.","So the real question is not how many names you can learn. It is: what botany do you need?"]},"angles":{"title":"What botany do you need?","items":[{"t":"Botany by interest","d":"Reconnect with nature and your well-being. A curiosity that never runs out, because there is always another plant to understand."},{"t":"Botany for decision-making","d":"Choose with evidence — for your health, your garden, your farm, your projects, your conservation choices."},{"t":"Botany to innovate","d":"Turn plant knowledge into new solutions. Innovation begins with observation and data — and to collect data well, you must first know why you are collecting it."}]},"reasons":{"title":"Three powerful reasons to know plants","items":[{"t":"Know the plants that matter to you","d":"Start with the plants in your life — your food, your garden, your remedies, your landscape."},{"t":"Choose with better evidence","d":"Understanding plants turns guesswork into informed decisions."},{"t":"Learn for strategy","d":"See the patterns and connections that let you plan, innovate and act."}]},"vocab":{"title":"Visual vocabulary — learn the patterns, not the names","items":[{"icon":"moss","t":"Moss","tag":"Bryophyte","d":"Low, soft, no true veins. Lives in damp shade and needs a film of water to reproduce. Pattern: tiny, carpet-like, no flowers."},{"icon":"fern","t":"Fern","tag":"Seedless vascular plant","d":"Feathery fronds with true veins (vessels); reproduces by spores under the leaves. Pattern: coiled young shoots, no seeds, no flowers."},{"icon":"conifer","t":"Conifer","tag":"Gymnosperm","d":"Woody, with needle or scale leaves; seeds sit naked on cones. Pattern: cones, evergreen, no true flowers."},{"icon":"flower","t":"Flowering plant","tag":"Angiosperm","d":"Has flowers and fruits that enclose the seeds. Pattern: flowers and fruits — the vast majority of plants around you."},{"icon":"vessel","t":"Vessel","tag":"Invention: transport","d":"Internal tubes that carry water and food. The invention that let plants grow tall and leave the water's edge."},{"icon":"seed","t":"Seed","tag":"Invention: portable life","d":"A tiny plant with its own food supply and protective coat. Frees plants from needing water to reproduce."},{"icon":"flower","t":"Flower","tag":"Invention: partnership","d":"The organ that attracts animals to move pollen — and later becomes a fruit that carries the seed."}]},"modules":[{"num":1,"title":"Learn to Know Plants — The Big Plant Story","subtitle":"How plants conquered the land, one invention at a time.","objectives":["Name the great groups of plants and the order in which they appeared.","Understand the challenges of moving from water to land.","Read a simple tree of relationships and see how shared features reveal shared ancestry."],"sections":[{"h":"What is a plant?","paras":["A plant is a living being that makes its own food from sunlight, water and carbon dioxide through photosynthesis. This ability, powered by the green pigment chlorophyll, is the foundation of almost all life on land.","Plants also share a firm cell wall and a life cycle that alternates between two generations — one that produces spores and one that produces sex cells. You do not need the details yet; just remember that plants are the great producers, the ones that capture the sun."]},{"h":"From water to land: the great challenge","paras":["Life began in water. The ancestors of plants were green algae, bathed and supported by their liquid world. Moving onto land meant solving four hard problems at once: how not to dry out, how to stand upright, how to carry water and food inside the body, and how to reproduce without water to carry the sperm.","The history of plants is the story of these problems being solved, one invention after another. Each big group you will meet represents a new solution — and each solution opened a new world."]},{"h":"Bryophytes — the pioneers","paras":["Mosses, liverworts and hornworts were among the first plants on land. They are small and low-growing, because they have no true internal plumbing (no vascular tissue) to lift water high. They still depend on a film of water for their sperm to swim to the egg, so they thrive in damp, shaded places.","Think of bryophytes as the brave first settlers: on land, but never far from moisture."]},{"h":"Ferns and their allies — the first plumbing","paras":["Ferns brought a revolution: vascular tissue, a system of internal tubes (xylem and phloem) that carries water up and food around. With plumbing and stiffening, plants could finally grow tall, and forests of tree-ferns and horsetails once covered the Earth.","Ferns still reproduce by spores and still need water for their sperm, so they remain tied to humidity — but they proved that plants could rise."]},{"h":"Gymnosperms — the naked seed","paras":["The next great inventions were the seed and pollen. A seed is a tiny plant packed with food and wrapped in a protective coat; pollen carries the male cells through the air, so water is no longer needed for fertilisation. Freed from moisture, plants could colonise dry lands and cold mountains.","Gymnosperms — conifers, cycads and Ginkgo — carry their seeds \"naked\" on cones or scales, not inside a fruit. Pines, firs and cedars are their living ambassadors."]},{"h":"Angiosperms — the flower revolution","paras":["Then came the flower. Angiosperms enclose their seeds inside a protective ovary that ripens into a fruit, and they attract animals with flowers to carry pollen and disperse seeds. This partnership with animals triggered the fastest explosion of diversity in plant history.","Today the flowering plants dominate the land — roughly nine of every ten plant species. Nearly all our crops, fruits, herbs and garden flowers are angiosperms."]},{"h":"Monocots and dicots: two ways to be a flowering plant","paras":["The flowering plants split early into two great lines. Monocots have one seed leaf, leaves with parallel veins, flower parts usually in threes, and fibrous roots — think grasses, palms, orchids, lilies, gingers.","Eudicots (often called dicots) have two seed leaves, leaves with a branching net of veins, flower parts usually in fours or fives, and often a main tap root — think beans, roses, sunflowers, mints, oaks. Learning to tell these two apart is one of the first real skills of a botanist."]},{"h":"Reading the tree of life","paras":["Notice the pattern: each group keeps the inventions of the one before and adds a new one. Vessels, then seeds, then flowers. A family tree (a phylogeny) simply draws this order of inventions.","The key idea is this: plants that share a feature usually share an ancestor who first evolved it. When you see a shared feature, you are seeing a clue about kinship. That is the heart of systematic botany."]}],"terms":["photosynthesis","spore","vascular tissue","seed","pollen","flower","fruit","cotyledon","monocot","eudicot","phylogeny"],"tip":"When you meet any new plant, first place it in the big picture: is it a moss, a fern, a conifer, or a flowering plant? Everything else becomes easier once you know the neighbourhood.","review":["Name the four great plant groups in the order they appeared.","What two inventions freed plants from needing water for reproduction?","Give one difference between a monocot and a dicot."],"practice":"Go outside and find three different plants. For each, decide its big group — moss, fern, conifer, or flowering plant — and write one reason for your choice.","diagrams":["tree","monoeu"]},{"num":2,"title":"Reading a Plant: The Features That Tell Its Story","subtitle":"Every organ is a clue; the flower is the plant's ID card.","objectives":["Name the main organs of a plant and what they do.","Use leaves and flowers to place a plant among families.","Understand why shared features define plant families."],"sections":[{"h":"Roots, stems and leaves","paras":["A plant's body has three basic organs. Roots anchor the plant and absorb water and minerals. The stem lifts leaves toward light and carries water and food between roots and leaves. Leaves are the solar panels, where photosynthesis happens.","Simple as this seems, the shapes these organs take are the first clues to a plant's identity and way of life."]},{"h":"Leaves: shape and arrangement","paras":["Look at whether a leaf is simple (one blade) or compound (divided into leaflets), and how leaves sit on the stem: opposite (in pairs), alternate (one at a time), or whorled (three or more at a node). These small details are surprisingly powerful for recognising plant groups.","Leaf veins matter too: parallel veins hint at a monocot, a branching net at a dicot."]},{"h":"The flower: the plant's ID card","paras":["A typical flower is built of four rings, from outside in: the sepals (usually green, protecting the bud), the petals (often coloured, attracting pollinators), the stamens (male parts that make pollen), and the carpels (female parts that hold the ovules). Botanists shorthand these as K, C, A and G.","Counting and examining these four rings is the single most useful habit in plant identification. The flower tells you, more than any other organ, which family a plant belongs to."]},{"h":"From flower to fruit and seed","paras":["After pollination, the ovary ripens into a fruit and the ovules become seeds. A fruit can be dry (a pod, a capsule, a nut) or fleshy (a berry, a drupe like a mango). The type of fruit is often a strong family signature.","So the flower and the fruit together tell most of a plant's story: how it reproduces, and who its relatives are."]},{"h":"How features build families","paras":["A plant family is a group of genera that share a package of features inherited from a common ancestor. Peas, beans and acacias share pods and butterfly-shaped flowers — the Fabaceae. Sunflowers, daisies and lettuces share flower \"heads\" of many tiny florets — the Asteraceae. Grasses share hollow stems and wind-pollinated flowers — the Poaceae.","Once you learn a family's signature, you can recognise its members anywhere in the world, even ones you have never seen before. That is the power of thinking in features."]}],"terms":["root","stem","leaf","sepal","petal","stamen","carpel","ovary","fruit","family"],"tip":"Carry a hand lens. The flower is a plant's identity document — count its parts, and you are already halfway to a name.","review":["What are the four whorls of a typical flower?","Name one plant family you can recognise by its fruit or flower.","Why are shared features the basis of plant families?"],"practice":"Pick one flower you can safely examine. Count its sepals, petals and stamens, and note how the leaves sit on the stem. Sketch it — no name needed.","diagrams":["flower","leaf","fruit"]},{"num":3,"title":"Plants and Their World: Adaptation to the Environment","subtitle":"Every strange shape is an answer to a question the environment asked.","objectives":["See adaptation as problem-solving, not accident.","Recognise common adaptations to water, light and soil.","Understand key partnerships that help plants survive."],"sections":[{"h":"Water: too little or too much","paras":["Water shapes plants more than any other factor. In deserts, xerophytes such as cacti store water in swollen stems, shrink their leaves to spines to reduce water loss, and open their pores only at night. In ponds and rivers, hydrophytes such as water lilies fill their tissues with air channels (aerenchyma) to float and breathe.","When you see a thick, waxy, or spiny plant, think \"dry world\"; when you see soft, spongy, floating tissue, think \"wet world\"."]},{"h":"Light and space","paras":["Light is a prize worth competing for. Climbers and vines use tendrils and twining stems to reach the canopy cheaply, without building a thick trunk. Epiphytes such as many orchids and bromeliads grow perched on other plants, high in the light, gathering water from rain and air rather than soil.","None of these are tricks; each is a different strategy for the same goal — a place in the sun."]},{"h":"Soil and partnerships","paras":["Roots do more than drink. Most plants live in partnership with fungi: mycorrhizae wrap or enter the roots and vastly extend their reach for water and nutrients, in exchange for sugars. Legumes (the pea family) partner with bacteria that capture nitrogen from the air, enriching the soil — which is why they are used to restore tired land.","A plant is never truly alone; it is a hub of quiet partnerships underground."]},{"h":"Reproduction: pollination and dispersal","paras":["To reproduce, a plant must first move pollen, then move seeds. Pollination may use wind (grasses, many trees), or animals lured by colour, scent and nectar (bees, butterflies, birds, bats). Seed dispersal may use wind (winged or plumed seeds), water (coconuts), or animals (fleshy fruits eaten and carried, or hooked seeds that hitch a ride).","Flowers and fruits, then, are not decoration — they are tools of movement, shaped by the partners a plant depends on."]}],"terms":["adaptation","xerophyte","hydrophyte","epiphyte","mycorrhiza","nitrogen fixation","pollination","dispersal"],"tip":"When a plant looks unusual, ask what problem the shape solves. The environment asks questions; the plant's form is its answer.","review":["Give one adaptation that helps a plant survive drought.","What is a mycorrhiza, and how does it help a plant?","Name two different ways seeds travel."],"practice":"Find a plant growing in an unusual spot (a wall, deep shade, dry ground, or water). Ask: what problem does its shape solve? Write your best guess.","diagrams":["adapt"]},{"num":4,"title":"The Chemistry of Survival: How Plants Protect Themselves","subtitle":"Rooted in place, plants defend themselves with molecules — and those molecules serve us too.","objectives":["Understand why plants are master chemists.","Recognise the main classes of plant compounds.","See how chemistry both reveals relationships and becomes a human resource."],"sections":[{"h":"Rooted, but not defenceless","paras":["A plant cannot run from a hungry insect or a grazing animal. Instead of fleeing, plants fight with chemistry and structure — spines and tough fibres on the outside, and a vast arsenal of protective molecules within. Much of what we taste, smell and use in plants began as defence.","This is why plants are the greatest chemists in nature: staying still forced them to become brilliant."]},{"h":"The defence chemists","paras":["A few great classes do most of the work. Alkaloids are bitter, nitrogen-rich compounds — caffeine, nicotine, quinine — that deter or poison attackers. Tannins are astringent compounds that make leaves hard to digest. Glucosinolates give mustard, cabbage and horseradish their pungent bite. Terpenes and essential oils bring the scents of mint, citrus, eucalyptus and pine, repelling pests and healing wounds.","A bitter taste, a sharp smell, a stinging sap: each is a molecule doing a job."]},{"h":"Colours with a purpose","paras":["Plant colours are chemistry too. Chlorophyll makes leaves green and captures light. Carotenoids give yellows and oranges and protect the leaf from excess sun. Anthocyanins paint many red, purple and blue flowers and fruits, attracting pollinators and dispersers, while betalains produce the red-violet of beets and cacti in one special group of plants.","Every colour in a garden is a message written in molecules."]},{"h":"Chemistry follows the family tree","paras":["Remarkably, these molecules often follow the tree of relationships. Betalain pigments appear almost only in one order (the Caryophyllales — cacti, beets, bougainvillea). Bitter iridoids mark many of the asterids. Mustard-oil glucosinolates cluster in the cabbage relatives. Because related plants inherit related chemistry, a compound can be a clue to kinship — a field called chemotaxonomy.","So the smell of a crushed leaf is not only pleasant; it can whisper which family the plant belongs to."]},{"h":"From plant defence to human benefit","paras":["Here is the exciting turn: what protects a plant often serves people. Defence alkaloids became medicines; aromatic terpenes became perfumes, flavours and remedies; pigments became foods and dyes. Understanding plant chemistry is the doorway to innovation in health, food and cosmetics — always with respect for the ecosystems that produce it.","To know a plant's chemistry is to hold a key: to healing, to flavour, to invention."]}],"terms":["alkaloid","tannin","glucosinolate","terpene / essential oil","pigment","anthocyanin","betalain","chemotaxonomy"],"tip":"Smell, taste (only what is safe and known), and look at colour. Each sensation is a molecule with a story — and often a use.","review":["Why must plants defend themselves with chemistry rather than movement?","Name two classes of plant defence molecules and one plant for each.","How can a plant's chemistry hint at its relatives?"],"practice":"Gently crush a leaf you know is safe (mint, citrus, eucalyptus…) and smell it. Note the smell and the colour. What might the plant use this molecule for?","diagrams":[]},{"num":5,"title":"From Knowledge to Impact: Your Path with Plants","subtitle":"Botany made simple becomes botany with a purpose.","objectives":["See how plant knowledge serves decisions, innovation, creation and personal joy.","Choose your next steps as a lifelong plant learner.","Connect your learning to a wider community of plant people."],"sections":[{"h":"Botany by interest — seeing nature differently","paras":["The first gift of this knowledge is wonder. Once you can name groups, read a flower and guess an adaptation, a walk in a park or a market becomes a conversation with living things. You stop depending only on apps and start thinking for yourself.","This is botany by interest: curiosity that never runs out, because there is always another plant to understand."]},{"h":"Botany for taking decisions","paras":["Knowledge guides good choices. Which trees to plant in a dry city? Which species to protect in a threatened forest? Which herb truly suits a need? Understanding plants — their groups, needs and chemistry — turns guesswork into wise decisions for gardens, health, farms and conservation.","To decide well about plants, you must first understand them."]},{"h":"Botany to innovate","paras":["The plant world is a treasury of solutions for food, medicine, materials and wellness. Real innovation does not just extract from plants; it understands their ecology and chemistry, and builds solutions that heal people and restore nature at the same time.","The best plant-based ideas are rooted in botany, not only in business."]},{"h":"Botany to create","paras":["Knowledge grows when it is shared. Teachers, writers, gardeners, photographers and content creators turn plant understanding into stories that reach others. If you learn to see plants clearly, you can help many more people see them too.","To create with plants is to pass the wonder on."]},{"h":"Keep growing — your next steps","paras":["You now hold a way of looking: observe, compare, connect. Practise it on the plants around you. Use the companion interactive Explorer to place any family on the tree of life, and the trilingual Glossary to master the vocabulary at your own pace.","Botany made simple is not the end of the road — it is the first step of a lifelong path. Welcome to the community of people connected by the power of plants."]}],"terms":["curiosity","observation","comparison","connection","stewardship"],"tip":"You do not need to memorise every plant. You need to know how to look, and where to connect what you see. That mindset is the whole course.","review":["In your own words, what does it mean to \"think like a botanist\"?","Which of the five paths — interest, decision, innovation, creation — speaks to you most, and why?","What is one plant near you that you will observe this week?"],"practice":"Choose one plant that matters to you. Write why it matters, and one decision or idea your new knowledge could improve.","diagrams":[]}],"capstone":{"kicker":"Capstone project","title":"Your First Botanist's Notebook","intro":"Bring the whole course together. Choose one plant near you and describe it using everything you have learned:","steps":["Its big group, and one feature that proves it.","The shape of its leaves and, if it has one, its flower.","One way it is adapted to where it grows.","One smell, taste (only if safe and known) or colour — and what the plant might use it for.","One reason this plant matters to you."],"keep":"Keep this page. It is your first real botanical observation — the beginning of your notebook."},"completion":{"title":"You've taken the first step.","text":"You now have a way of looking: observe, compare, connect. This foundation is where a lifelong journey with plants begins. Ready to go deeper, sharpen your skills, and grow into a true Botapreneur?","btn":"Continue with PlantsMastery","url":"https://www.plantsmastery.com","note":"PlantsMastery is the Botapreneurs training path — the next stage of your learning."},"vis":{"steps":{"life":"Life","land":"Land","transport":"Transport","seed":"Seed","flower":"Flower"},"lin":{"algae":"Green algae","bryo":"Mosses","fern":"Ferns","gymno":"Conifers","angio":"Flowering plants"},"treeFoot":"Each group keeps the old inventions and adds a new one — a story of useful innovation.","mono":"Monocots","eudi":"Eudicots (dicots)","rSeed":"Seed leaves","rVein":"Leaf veins","rFlower":"Flower parts","rRoot":"Roots","monoSeed":"1","eudiSeed":"2","monoVein":"parallel","eudiVein":"net / branched","monoFlower":"in 3s","eudiFlower":"in 4s or 5s","monoRoot":"fibrous","eudiRoot":"tap root","sepals":"Sepals","petals":"Petals","stamens":"Stamens","carpels":"Carpels","opposite":"Opposite","alternate":"Alternate","whorled":"Whorled","dry":"Dry fruit","fleshy":"Fleshy fruit","dryEx":"pod · capsule · nut","fleshyEx":"berry · drupe","cactus":"Cactus","dryWorld":"dry world","lily":"Water lily","wetWorld":"wet world","caps":{"tree":"The plant story: a ladder of useful innovations","monoeu":"Two ways to be a flowering plant","flower":"The flower: four whorls (K · C · A · G)","leaf":"Leaf arrangement patterns","fruit":"Dry vs fleshy fruit","adapt":"Same goal, different answers"}}},"fr":{"ui":{"brand":"Botapreneurs","tagline":"Where Botany Meets Business","why":"Pourquoi la botanique","module":"Module","start":"Commencer le cours","courseKicker":"La Botanique en Simple · Plant Enthusiasts","objectives":"Objectifs d'apprentissage","keyterms":"Termes clés","tip":"Penser comme un botaniste","review":"Vérifiez votre compréhension","next":"Suivant","prev":"Retour","tapHint":"Touchez une carte pour révéler son motif.","reasonWord":"Raison","finishNav":"Fin","practice":"À faire dans la nature","capstoneNav":"Projet final"},"hero":{"title":"La Botanique en Simple","hook":"Arrêtez de mémoriser des noms. Commencez à voir des motifs — et comprenez les plantes qui nous nourrissent, nous soignent et gardent la planète vivante.","angles":"La botanique par intérêt · pour décider · pour innover"},"intro":{"title":"Pourquoi la botanique — et pourquoi ce cours","paras":["La botanique est une discipline puissante. Elle façonne la santé des êtres humains et la santé de la planète. La nourriture que nous mangeons et l'énergie qui nous fait vivre commencent par les plantes, et les plantes sont le premier pas vers un meilleur environnement pour la vie.","La botanique est une université vivante. Elle s'enseigne non seulement à l'école, mais dans la nature, dans la famille et dans la vie quotidienne — partout où les plantes nous touchent.","Pourtant, pendant longtemps, la botanique a été enseignée de façon compliquée. On demandait aux gens de mémoriser des noms scientifiques sans jamais comprendre les relations entre les plantes, ni les motifs qui les relient. Un savoir sans compréhension s'oublie vite.","Ce cours a un but plus grand : redonner à la botanique la place qu'elle mérite — au centre des meilleures décisions — et la rendre simple, pratique et vivante. Non pour mémoriser, mais pour aller dans la nature ; lire les motifs ; comprendre les écosystèmes et les usages ; et se sentir plus relié — pour votre bien-être, votre innovation et votre intérêt.","La vraie question n'est donc pas combien de noms vous pouvez apprendre. C'est : de quelle botanique avez-vous besoin ?"]},"angles":{"title":"De quelle botanique avez-vous besoin ?","items":[{"t":"La botanique par intérêt","d":"Renouer avec la nature et votre bien-être. Une curiosité qui ne s'épuise jamais, car il y a toujours une autre plante à comprendre."},{"t":"La botanique pour décider","d":"Choisir avec des preuves — pour votre santé, votre jardin, votre ferme, vos projets, vos choix de conservation."},{"t":"La botanique pour innover","d":"Transformer le savoir végétal en nouvelles solutions. L'innovation commence par l'observation et les données — et pour bien collecter des données, il faut d'abord savoir pourquoi on les collecte."}]},"reasons":{"title":"Trois raisons puissantes de connaître les plantes","items":[{"t":"Connaître les plantes qui comptent pour vous","d":"Commencez par les plantes de votre vie — votre alimentation, votre jardin, vos remèdes, votre paysage."},{"t":"Choisir avec de meilleures preuves","d":"Comprendre les plantes transforme les suppositions en décisions éclairées."},{"t":"Apprendre pour la stratégie","d":"Voir les motifs et les connexions qui permettent de planifier, d'innover et d'agir."}]},"vocab":{"title":"Vocabulaire visuel — apprendre les motifs, pas les noms","items":[{"icon":"moss","t":"Mousse","tag":"Bryophyte","d":"Basse, molle, sans vraies nervures. Vit à l'ombre humide et a besoin d'un film d'eau pour se reproduire. Motif : minuscule, en tapis, sans fleurs."},{"icon":"fern","t":"Fougère","tag":"Plante vasculaire sans graine","d":"Frondes plumeuses à vraies nervures (vaisseaux) ; se reproduit par spores sous les feuilles. Motif : jeunes pousses enroulées, ni graines ni fleurs."},{"icon":"conifer","t":"Conifère","tag":"Gymnosperme","d":"Ligneux, feuilles en aiguilles ou écailles ; graines nues sur des cônes. Motif : cônes, persistant, pas de vraies fleurs."},{"icon":"flower","t":"Plante à fleurs","tag":"Angiosperme","d":"Possède des fleurs et des fruits qui enferment les graines. Motif : fleurs et fruits — la grande majorité des plantes autour de vous."},{"icon":"vessel","t":"Vaisseau","tag":"Invention : le transport","d":"Tubes internes qui transportent l'eau et la nourriture. L'invention qui a permis aux plantes de grandir et de quitter le bord de l'eau."},{"icon":"seed","t":"Graine","tag":"Invention : la vie portable","d":"Une minuscule plante avec ses réserves et une enveloppe protectrice. Libère les plantes du besoin d'eau pour se reproduire."},{"icon":"flower","t":"Fleur","tag":"Invention : le partenariat","d":"L'organe qui attire les animaux pour déplacer le pollen — et devient ensuite un fruit qui porte la graine."}]},"modules":[{"num":1,"title":"Apprendre à connaître les plantes — La grande histoire des plantes","subtitle":"Comment les plantes ont conquis la terre ferme, une invention à la fois.","objectives":["Nommer les grands groupes de plantes et l'ordre de leur apparition.","Comprendre les défis du passage de l'eau à la terre ferme.","Lire un arbre de parenté simple et voir comment les caractères partagés révèlent une ascendance commune."],"sections":[{"h":"Qu'est-ce qu'une plante ?","paras":["Une plante est un être vivant qui fabrique sa propre nourriture à partir de la lumière du soleil, de l'eau et du dioxyde de carbone, par la photosynthèse. Cette capacité, portée par le pigment vert qu'est la chlorophylle, est le fondement de presque toute la vie terrestre.","Les plantes partagent aussi une paroi cellulaire rigide et un cycle de vie qui alterne deux générations — l'une produit des spores, l'autre des cellules sexuelles. Nul besoin des détails pour l'instant ; retenez que les plantes sont les grandes productrices, celles qui captent le soleil."]},{"h":"De l'eau à la terre : le grand défi","paras":["La vie a commencé dans l'eau. Les ancêtres des plantes étaient des algues vertes, baignées et soutenues par leur monde liquide. Passer à la terre ferme, c'était résoudre d'un coup quatre problèmes difficiles : ne pas se dessécher, tenir debout, transporter l'eau et la nourriture à l'intérieur du corps, et se reproduire sans eau pour porter les cellules mâles.","L'histoire des plantes est celle de ces problèmes résolus, invention après invention. Chaque grand groupe que vous rencontrerez représente une nouvelle solution — et chaque solution a ouvert un nouveau monde."]},{"h":"Les bryophytes — les pionnières","paras":["Les mousses, les hépatiques et les anthocérotes furent parmi les premières plantes terrestres. Elles sont petites et rampantes, car elles n'ont pas de véritable plomberie interne (pas de tissu vasculaire) pour élever l'eau. Elles dépendent encore d'un film d'eau pour que leurs cellules mâles nagent jusqu'à l'ovule ; elles prospèrent donc dans les lieux humides et ombragés.","Voyez les bryophytes comme les premiers colons courageux : sur la terre, mais jamais loin de l'humidité."]},{"h":"Les fougères et leurs alliées — la première plomberie","paras":["Les fougères ont apporté une révolution : le tissu vasculaire, un réseau de tubes internes (xylème et phloème) qui fait monter l'eau et circuler la nourriture. Avec cette plomberie et un renforcement, les plantes ont enfin pu grandir, et des forêts de fougères arborescentes et de prêles ont autrefois couvert la Terre.","Les fougères se reproduisent encore par spores et ont encore besoin d'eau pour leurs cellules mâles : elles restent liées à l'humidité — mais elles ont prouvé que les plantes pouvaient s'élever."]},{"h":"Les gymnospermes — la graine nue","paras":["Les inventions suivantes furent la graine et le pollen. Une graine est une minuscule plante remplie de réserves et protégée par une enveloppe ; le pollen transporte les cellules mâles par l'air, si bien que l'eau n'est plus nécessaire à la fécondation. Libérées de l'humidité, les plantes ont pu coloniser les terres sèches et les montagnes froides.","Les gymnospermes — conifères, cycas et Ginkgo — portent leurs graines « nues » sur des cônes ou des écailles, non dans un fruit. Pins, sapins et cèdres en sont les ambassadeurs vivants."]},{"h":"Les angiospermes — la révolution de la fleur","paras":["Puis vint la fleur. Les angiospermes enferment leurs graines dans un ovaire protecteur qui mûrit en fruit, et elles attirent les animaux par leurs fleurs pour transporter le pollen et disperser les graines. Ce partenariat avec les animaux a déclenché la plus rapide explosion de diversité de l'histoire des plantes.","Aujourd'hui, les plantes à fleurs dominent la terre — près de neuf espèces de plantes sur dix. Presque toutes nos cultures, fruits, herbes et fleurs de jardin sont des angiospermes."]},{"h":"Monocotylédones et dicotylédones : deux façons d'être une plante à fleurs","paras":["Les plantes à fleurs se sont scindées tôt en deux grandes lignées. Les monocotylédones ont un seul cotylédon, des feuilles à nervures parallèles, des pièces florales généralement par trois et des racines fasciculées — pensez aux graminées, palmiers, orchidées, lis, gingembres.","Les eudicotylédones (souvent appelées dicotylédones) ont deux cotylédons, des feuilles à nervures ramifiées en réseau, des pièces florales généralement par quatre ou cinq, et souvent une racine pivotante — pensez aux haricots, roses, tournesols, menthes, chênes. Savoir distinguer ces deux groupes est l'une des premières vraies compétences du botaniste."]},{"h":"Lire l'arbre du vivant","paras":["Remarquez le schéma : chaque groupe conserve les inventions du précédent et en ajoute une nouvelle. Les vaisseaux, puis les graines, puis les fleurs. Un arbre de parenté (une phylogénie) ne fait que dessiner cet ordre des inventions.","L'idée clé est la suivante : les plantes qui partagent un caractère partagent en général un ancêtre qui l'a fait apparaître. Voir un caractère partagé, c'est voir un indice de parenté. C'est le cœur de la botanique systématique."]}],"terms":["photosynthèse","spore","tissu vasculaire","graine","pollen","fleur","fruit","cotylédon","monocotylédone","eudicotylédone","phylogénie"],"tip":"Devant toute plante nouvelle, situez-la d'abord dans le grand tableau : mousse, fougère, conifère ou plante à fleurs ? Tout le reste devient plus facile une fois le voisinage connu.","review":["Nommez les quatre grands groupes de plantes dans l'ordre de leur apparition.","Quelles deux inventions ont libéré les plantes du besoin d'eau pour se reproduire ?","Donnez une différence entre une monocotylédone et une dicotylédone."],"practice":"Sortez et trouvez trois plantes différentes. Pour chacune, décidez son grand groupe — mousse, fougère, conifère ou plante à fleurs — et écrivez une raison de votre choix.","diagrams":["tree","monoeu"]},{"num":2,"title":"Lire une plante : les caractères qui racontent son histoire","subtitle":"Chaque organe est un indice ; la fleur est la carte d'identité de la plante.","objectives":["Nommer les principaux organes d'une plante et leur rôle.","Utiliser les feuilles et les fleurs pour situer une plante parmi les familles.","Comprendre pourquoi les caractères partagés définissent les familles de plantes."],"sections":[{"h":"Racines, tiges et feuilles","paras":["Le corps d'une plante possède trois organes de base. Les racines ancrent la plante et absorbent l'eau et les minéraux. La tige élève les feuilles vers la lumière et fait circuler l'eau et la nourriture entre racines et feuilles. Les feuilles sont les panneaux solaires, là où se déroule la photosynthèse.","Aussi simple que cela paraisse, la forme de ces organes est le premier indice de l'identité et du mode de vie d'une plante."]},{"h":"Les feuilles : forme et disposition","paras":["Observez si une feuille est simple (un seul limbe) ou composée (divisée en folioles), et comment les feuilles s'insèrent sur la tige : opposées (par paires), alternes (une à la fois) ou verticillées (trois ou plus par nœud). Ces petits détails sont étonnamment puissants pour reconnaître les groupes.","Les nervures comptent aussi : des nervures parallèles évoquent une monocotylédone, un réseau ramifié une dicotylédone."]},{"h":"La fleur : la carte d'identité de la plante","paras":["Une fleur typique est bâtie de quatre couronnes, de l'extérieur vers l'intérieur : les sépales (souvent verts, protégeant le bouton), les pétales (souvent colorés, attirant les pollinisateurs), les étamines (parties mâles produisant le pollen) et les carpelles (parties femelles portant les ovules). Les botanistes les abrègent en K, C, A et G.","Compter et examiner ces quatre couronnes est l'habitude la plus utile en identification. Plus que tout autre organe, la fleur vous dit à quelle famille appartient une plante."]},{"h":"De la fleur au fruit et à la graine","paras":["Après la pollinisation, l'ovaire mûrit en fruit et les ovules deviennent des graines. Un fruit peut être sec (une gousse, une capsule, une noix) ou charnu (une baie, une drupe comme la mangue). Le type de fruit est souvent une forte signature de famille.","Ainsi, la fleur et le fruit racontent ensemble l'essentiel de l'histoire d'une plante : comment elle se reproduit, et qui sont ses parents."]},{"h":"Comment les caractères forment les familles","paras":["Une famille de plantes est un groupe de genres qui partagent un ensemble de caractères hérités d'un ancêtre commun. Pois, haricots et acacias partagent des gousses et des fleurs en papillon — les Fabaceae. Tournesols, marguerites et laitues partagent des « capitules » de multiples petites fleurs — les Asteraceae. Les graminées partagent des tiges creuses et des fleurs pollinisées par le vent — les Poaceae.","Une fois la signature d'une famille apprise, vous reconnaissez ses membres partout dans le monde, même ceux que vous n'avez jamais vus. Telle est la force de penser en caractères."]}],"terms":["racine","tige","feuille","sépale","pétale","étamine","carpelle","ovaire","fruit","famille"],"tip":"Emportez une loupe. La fleur est le document d'identité de la plante — comptez ses pièces, et vous êtes déjà à mi-chemin d'un nom.","review":["Quelles sont les quatre couronnes d'une fleur typique ?","Nommez une famille de plantes reconnaissable à son fruit ou à sa fleur.","Pourquoi les caractères partagés sont-ils la base des familles de plantes ?"],"practice":"Choisissez une fleur que vous pouvez examiner sans danger. Comptez ses sépales, pétales et étamines, et notez la disposition des feuilles sur la tige. Dessinez-la — sans nom.","diagrams":["flower","leaf","fruit"]},{"num":3,"title":"Les plantes et leur monde : l'adaptation au milieu","subtitle":"Chaque forme étrange est une réponse à une question posée par le milieu.","objectives":["Voir l'adaptation comme une résolution de problèmes, non comme un hasard.","Reconnaître les adaptations courantes à l'eau, à la lumière et au sol.","Comprendre les partenariats clés qui aident les plantes à survivre."],"sections":[{"h":"L'eau : trop peu ou trop","paras":["L'eau façonne les plantes plus que tout autre facteur. Dans les déserts, les xérophytes comme les cactus stockent l'eau dans des tiges gonflées, réduisent leurs feuilles à des épines pour limiter les pertes, et n'ouvrent leurs pores que la nuit. Dans les mares et les rivières, les hydrophytes comme les nénuphars remplissent leurs tissus de canaux d'air (aérenchyme) pour flotter et respirer.","Devant une plante épaisse, cireuse ou épineuse, pensez « monde sec » ; devant un tissu mou, spongieux, flottant, pensez « monde humide »."]},{"h":"La lumière et l'espace","paras":["La lumière est un trésor pour lequel il vaut la peine de rivaliser. Les grimpantes et les lianes utilisent des vrilles et des tiges volubiles pour atteindre la canopée à peu de frais, sans bâtir de tronc épais. Les épiphytes, comme de nombreuses orchidées et broméliacées, poussent perchées sur d'autres plantes, en pleine lumière, puisant l'eau de la pluie et de l'air plutôt que du sol.","Ce ne sont pas des ruses ; chacune est une stratégie différente pour un même but — une place au soleil."]},{"h":"Le sol et les partenariats","paras":["Les racines ne font pas que boire. La plupart des plantes vivent en partenariat avec des champignons : les mycorhizes entourent ou pénètrent les racines et étendent considérablement leur portée pour l'eau et les nutriments, en échange de sucres. Les légumineuses (la famille du pois) s'associent à des bactéries qui captent l'azote de l'air et enrichissent le sol — c'est pourquoi on les utilise pour restaurer les terres épuisées.","Une plante n'est jamais vraiment seule ; c'est un carrefour de partenariats discrets sous la terre."]},{"h":"La reproduction : pollinisation et dispersion","paras":["Pour se reproduire, une plante doit d'abord déplacer le pollen, puis les graines. La pollinisation peut se faire par le vent (graminées, nombreux arbres) ou par des animaux attirés par la couleur, l'odeur et le nectar (abeilles, papillons, oiseaux, chauves-souris). La dispersion des graines peut se faire par le vent (graines ailées ou plumeuses), par l'eau (noix de coco) ou par les animaux (fruits charnus mangés et emportés, ou graines à crochets qui font de l'auto-stop).","Fleurs et fruits ne sont donc pas des ornements — ce sont des outils de déplacement, façonnés par les partenaires dont la plante dépend."]}],"terms":["adaptation","xérophyte","hydrophyte","épiphyte","mycorhize","fixation de l'azote","pollinisation","dispersion"],"tip":"Quand une plante paraît inhabituelle, demandez-vous quel problème sa forme résout. Le milieu pose des questions ; la forme de la plante est sa réponse.","review":["Donnez une adaptation qui aide une plante à survivre à la sécheresse.","Qu'est-ce qu'une mycorhize, et comment aide-t-elle la plante ?","Nommez deux façons différentes dont voyagent les graines."],"practice":"Trouvez une plante qui pousse dans un endroit inhabituel (un mur, l'ombre profonde, un sol sec ou l'eau). Demandez : quel problème sa forme résout-elle ? Écrivez votre meilleure hypothèse.","diagrams":["adapt"]},{"num":4,"title":"La chimie de la survie : comment les plantes se protègent","subtitle":"Enracinées sur place, les plantes se défendent par des molécules — et ces molécules nous servent aussi.","objectives":["Comprendre pourquoi les plantes sont de grandes chimistes.","Reconnaître les principales classes de composés végétaux.","Voir comment la chimie révèle la parenté et devient une ressource pour l'humain."],"sections":[{"h":"Enracinées, mais pas sans défense","paras":["Une plante ne peut pas fuir un insecte affamé ou un animal qui broute. Au lieu de fuir, les plantes combattent par la chimie et la structure — épines et fibres dures à l'extérieur, et un vaste arsenal de molécules protectrices à l'intérieur. Une grande part de ce que nous goûtons, sentons et utilisons dans les plantes est née comme une défense.","C'est pourquoi les plantes sont les plus grandes chimistes de la nature : l'immobilité les a forcées à devenir brillantes."]},{"h":"Les chimistes de la défense","paras":["Quelques grandes classes font l'essentiel du travail. Les alcaloïdes sont des composés amers, riches en azote — caféine, nicotine, quinine — qui dissuadent ou empoisonnent les agresseurs. Les tanins sont des composés astringents qui rendent les feuilles difficiles à digérer. Les glucosinolates donnent leur piquant à la moutarde, au chou et au raifort. Les terpènes et huiles essentielles apportent les parfums de la menthe, des agrumes, de l'eucalyptus et du pin, repoussant les ravageurs et cicatrisant les blessures.","Un goût amer, une odeur vive, une sève irritante : chacun est une molécule qui fait son travail."]},{"h":"Des couleurs qui ont un but","paras":["Les couleurs des plantes sont aussi de la chimie. La chlorophylle rend les feuilles vertes et capte la lumière. Les caroténoïdes donnent les jaunes et les oranges et protègent la feuille de l'excès de soleil. Les anthocyanes peignent de nombreuses fleurs et fruits en rouge, violet et bleu, attirant pollinisateurs et disperseurs, tandis que les bétalaïnes produisent le rouge-violet des betteraves et des cactus dans un groupe particulier de plantes.","Chaque couleur d'un jardin est un message écrit en molécules."]},{"h":"La chimie suit l'arbre de parenté","paras":["Fait remarquable, ces molécules suivent souvent l'arbre de parenté. Les pigments bétalaïnes n'apparaissent presque que dans un ordre (les Caryophyllales — cactus, betteraves, bougainvilliers). Les iridoïdes amers marquent bon nombre des astéridées. Les glucosinolates (huiles de moutarde) se regroupent chez les parentes du chou. Comme les plantes apparentées héritent d'une chimie apparentée, un composé peut être un indice de parenté — un domaine appelé chimiotaxonomie.","Ainsi l'odeur d'une feuille froissée n'est pas seulement agréable ; elle peut chuchoter à quelle famille la plante appartient."]},{"h":"De la défense des plantes au bénéfice humain","paras":["Voici le tournant passionnant : ce qui protège une plante sert souvent les humains. Des alcaloïdes de défense sont devenus des médicaments ; des terpènes aromatiques sont devenus parfums, arômes et remèdes ; des pigments sont devenus colorants et aliments. Comprendre la chimie des plantes est la porte de l'innovation en santé, alimentation et cosmétique — toujours dans le respect des écosystèmes qui la produisent.","Connaître la chimie d'une plante, c'est tenir une clé : vers la guérison, la saveur, l'invention."]}],"terms":["alcaloïde","tanin","glucosinolate","terpène / huile essentielle","pigment","anthocyane","bétalaïne","chimiotaxonomie"],"tip":"Sentez, goûtez (seulement ce qui est sûr et connu) et observez la couleur. Chaque sensation est une molécule avec une histoire — et souvent un usage.","review":["Pourquoi les plantes doivent-elles se défendre par la chimie plutôt que par le mouvement ?","Nommez deux classes de molécules de défense et une plante pour chacune.","Comment la chimie d'une plante peut-elle indiquer sa parenté ?"],"practice":"Froissez doucement une feuille que vous savez sans danger (menthe, agrume, eucalyptus…) et sentez-la. Notez l'odeur et la couleur. À quoi la plante pourrait-elle servir cette molécule ?","diagrams":[]},{"num":5,"title":"Du savoir à l'impact : votre chemin avec les plantes","subtitle":"La botanique en simple devient une botanique qui a un but.","objectives":["Voir comment le savoir végétal sert la décision, l'innovation, la création et la joie personnelle.","Choisir vos prochaines étapes comme apprenant des plantes pour la vie.","Relier votre apprentissage à une communauté plus large de passionnés de plantes."],"sections":[{"h":"La botanique par passion — voir la nature autrement","paras":["Le premier cadeau de ce savoir est l'émerveillement. Dès que vous savez nommer les groupes, lire une fleur et deviner une adaptation, une promenade dans un parc ou un marché devient une conversation avec le vivant. Vous cessez de dépendre seulement des applications et commencez à penser par vous-même.","C'est la botanique par passion : une curiosité qui ne s'épuise jamais, car il y a toujours une autre plante à comprendre."]},{"h":"La botanique pour décider","paras":["Le savoir guide les bons choix. Quels arbres planter dans une ville sèche ? Quelles espèces protéger dans une forêt menacée ? Quelle plante convient vraiment à un besoin ? Comprendre les plantes — leurs groupes, leurs besoins, leur chimie — transforme les suppositions en décisions avisées pour les jardins, la santé, l'agriculture et la conservation.","Pour bien décider au sujet des plantes, il faut d'abord les comprendre."]},{"h":"La botanique pour innover","paras":["Le monde végétal est un trésor de solutions pour l'alimentation, la médecine, les matériaux et le bien-être. La vraie innovation ne se contente pas d'extraire des plantes ; elle comprend leur écologie et leur chimie, et bâtit des solutions qui soignent les personnes et restaurent la nature en même temps.","Les meilleures idées à base de plantes sont enracinées dans la botanique, pas seulement dans les affaires."]},{"h":"La botanique pour créer","paras":["Le savoir grandit quand il est partagé. Enseignants, auteurs, jardiniers, photographes et créateurs de contenu transforment la compréhension des plantes en récits qui atteignent les autres. Si vous apprenez à voir clairement les plantes, vous pouvez aider bien d'autres à les voir aussi.","Créer avec les plantes, c'est transmettre l'émerveillement."]},{"h":"Continuer à grandir — vos prochaines étapes","paras":["Vous détenez désormais une façon de regarder : observer, comparer, relier. Exercez-la sur les plantes qui vous entourent. Utilisez l'Explorateur interactif qui accompagne ce cours pour situer n'importe quelle famille sur l'arbre du vivant, et le Glossaire trilingue pour maîtriser le vocabulaire à votre rythme.","La botanique en simple n'est pas la fin du chemin — c'est le premier pas d'un parcours pour la vie. Bienvenue dans la communauté des personnes reliées par la puissance des plantes."]}],"terms":["curiosité","observation","comparaison","connexion","intendance"],"tip":"Vous n'avez pas à mémoriser chaque plante. Vous devez savoir comment regarder, et où relier ce que vous voyez. Cet état d'esprit, c'est tout le cours.","review":["Avec vos mots, que signifie « penser comme un botaniste » ?","Lequel des chemins — passion, décision, innovation, création — vous parle le plus, et pourquoi ?","Quelle plante proche de vous allez-vous observer cette semaine ?"],"practice":"Choisissez une plante qui compte pour vous. Écrivez pourquoi elle compte, et une décision ou une idée que votre nouveau savoir pourrait améliorer.","diagrams":[]}],"capstone":{"kicker":"Projet final","title":"Votre premier carnet de botaniste","intro":"Réunissez tout le cours. Choisissez une plante près de vous et décrivez-la avec tout ce que vous avez appris :","steps":["Son grand groupe, et un caractère qui le prouve.","La forme de ses feuilles et, si elle en a une, de sa fleur.","Une façon dont elle est adaptée à son lieu de vie.","Une odeur, un goût (seulement si sûr et connu) ou une couleur — et à quoi la plante pourrait servir cela.","Une raison pour laquelle cette plante compte pour vous."],"keep":"Gardez cette page. C'est votre première vraie observation botanique — le début de votre carnet."},"completion":{"title":"Vous avez fait le premier pas.","text":"Vous détenez désormais une façon de regarder : observer, comparer, relier. Cette base est le point de départ d'un parcours pour la vie avec les plantes. Prêt à aller plus loin, affûter vos compétences et devenir un véritable Botapreneur ?","btn":"Continuer avec PlantsMastery","url":"https://www.plantsmastery.com","note":"PlantsMastery est le parcours de formation Botapreneurs — la prochaine étape de votre apprentissage."},"vis":{"steps":{"life":"Vie","land":"Terre","transport":"Transport","seed":"Graine","flower":"Fleur"},"lin":{"algae":"Algues vertes","bryo":"Mousses","fern":"Fougères","gymno":"Conifères","angio":"Plantes à fleurs"},"treeFoot":"Chaque groupe garde les anciennes inventions et en ajoute une nouvelle — une histoire d'innovation utile.","mono":"Monocotylédones","eudi":"Eudicotylédones (dicots)","rSeed":"Cotylédons","rVein":"Nervures","rFlower":"Pièces florales","rRoot":"Racines","monoSeed":"1","eudiSeed":"2","monoVein":"parallèles","eudiVein":"en réseau","monoFlower":"par 3","eudiFlower":"par 4 ou 5","monoRoot":"fasciculées","eudiRoot":"pivotante","sepals":"Sépales","petals":"Pétales","stamens":"Étamines","carpels":"Carpelles","opposite":"Opposées","alternate":"Alternes","whorled":"Verticillées","dry":"Fruit sec","fleshy":"Fruit charnu","dryEx":"gousse · capsule · noix","fleshyEx":"baie · drupe","cactus":"Cactus","dryWorld":"monde sec","lily":"Nénuphar","wetWorld":"monde humide","caps":{"tree":"L'histoire des plantes : une échelle d'inventions utiles","monoeu":"Deux façons d'être une plante à fleurs","flower":"La fleur : quatre couronnes (K · C · A · G)","leaf":"Motifs de disposition des feuilles","fruit":"Fruit sec ou charnu","adapt":"Même but, réponses différentes"}}},"es":{"ui":{"brand":"Botapreneurs","tagline":"Where Botany Meets Business","why":"Por qué la botánica","module":"Módulo","start":"Empezar el curso","courseKicker":"La Botánica en Simple · Plant Enthusiasts","objectives":"Objetivos de aprendizaje","keyterms":"Términos clave","tip":"Pensar como un botánico","review":"Comprueba lo aprendido","next":"Siguiente","prev":"Atrás","tapHint":"Toca una tarjeta para revelar su patrón.","reasonWord":"Razón","finishNav":"Fin","practice":"Hazlo en la naturaleza","capstoneNav":"Proyecto final"},"hero":{"title":"La Botánica en Simple","hook":"Deja de memorizar nombres. Empieza a ver patrones — y comprende las plantas que nos alimentan, nos curan y mantienen viva la Tierra.","angles":"La botánica por interés · para decidir · para innovar"},"intro":{"title":"Por qué la botánica — y por qué este curso","paras":["La botánica es una disciplina poderosa. Moldea la salud de los seres humanos y la salud del planeta. La comida que comemos y la energía de la que vivimos empiezan por las plantas, y las plantas son el primer paso hacia un mejor entorno para la vida.","La botánica es una universidad viva. Se enseña no solo en la escuela, sino en la naturaleza, en la familia y en la vida cotidiana — allí donde las plantas nos tocan.","Sin embargo, durante mucho tiempo la botánica se enseñó de forma complicada. Se pedía a la gente memorizar nombres científicos sin comprender nunca las relaciones entre las plantas, ni los patrones que las conectan. Un saber sin comprensión se olvida pronto.","Este curso tiene una meta mayor: devolver a la botánica el lugar que merece — en el centro de las mejores decisiones — y hacerla simple, práctica y viva. No para memorizar, sino para ir a la naturaleza; leer los patrones; comprender los ecosistemas y los usos; y sentirse más conectado — por tu bienestar, tu innovación y tu interés.","Así que la verdadera pregunta no es cuántos nombres puedes aprender. Es: ¿qué botánica necesitas?"]},"angles":{"title":"¿Qué botánica necesitas?","items":[{"t":"La botánica por interés","d":"Reconecta con la naturaleza y tu bienestar. Una curiosidad que nunca se agota, porque siempre hay otra planta que comprender."},{"t":"La botánica para decidir","d":"Elegir con evidencia — para tu salud, tu jardín, tu finca, tus proyectos, tus decisiones de conservación."},{"t":"La botánica para innovar","d":"Convierte el saber vegetal en nuevas soluciones. La innovación empieza por la observación y los datos — y para recopilar datos bien, primero hay que saber por qué se recopilan."}]},"reasons":{"title":"Tres razones poderosas para conocer las plantas","items":[{"t":"Conocer las plantas que te importan","d":"Empieza por las plantas de tu vida — tu comida, tu jardín, tus remedios, tu paisaje."},{"t":"Elegir con mejor evidencia","d":"Comprender las plantas convierte las conjeturas en decisiones informadas."},{"t":"Aprender para la estrategia","d":"Ver los patrones y conexiones que te permiten planificar, innovar y actuar."}]},"vocab":{"title":"Vocabulario visual — aprende los patrones, no los nombres","items":[{"icon":"moss","t":"Musgo","tag":"Briofita","d":"Bajo, blando, sin nervios verdaderos. Vive a la sombra húmeda y necesita una película de agua para reproducirse. Patrón: diminuto, como alfombra, sin flores."},{"icon":"fern","t":"Helecho","tag":"Planta vascular sin semilla","d":"Frondes plumosas con nervios verdaderos (vasos); se reproduce por esporas bajo las hojas. Patrón: brotes jóvenes enrollados, sin semillas ni flores."},{"icon":"conifer","t":"Conífera","tag":"Gimnosperma","d":"Leñosa, con hojas en aguja o escama; semillas desnudas sobre conos. Patrón: conos, perenne, sin flores verdaderas."},{"icon":"flower","t":"Planta con flores","tag":"Angiosperma","d":"Tiene flores y frutos que encierran las semillas. Patrón: flores y frutos — la gran mayoría de las plantas a tu alrededor."},{"icon":"vessel","t":"Vaso","tag":"Invento: el transporte","d":"Tubos internos que transportan agua y alimento. El invento que permitió a las plantas crecer altas y dejar la orilla del agua."},{"icon":"seed","t":"Semilla","tag":"Invento: vida portátil","d":"Una diminuta planta con sus reservas y una cubierta protectora. Libera a las plantas de necesitar agua para reproducirse."},{"icon":"flower","t":"Flor","tag":"Invento: la alianza","d":"El órgano que atrae a los animales para mover el polen — y luego se convierte en un fruto que lleva la semilla."}]},"modules":[{"num":1,"title":"Aprender a conocer las plantas — La gran historia de las plantas","subtitle":"Cómo las plantas conquistaron la tierra firme, un invento a la vez.","objectives":["Nombrar los grandes grupos de plantas y el orden en que aparecieron.","Comprender los retos del paso del agua a la tierra firme.","Leer un árbol de parentesco sencillo y ver cómo los caracteres compartidos revelan un ancestro común."],"sections":[{"h":"¿Qué es una planta?","paras":["Una planta es un ser vivo que fabrica su propio alimento a partir de la luz del sol, el agua y el dióxido de carbono, mediante la fotosíntesis. Esta capacidad, impulsada por el pigmento verde llamado clorofila, es la base de casi toda la vida terrestre.","Las plantas también comparten una pared celular rígida y un ciclo de vida que alterna dos generaciones — una produce esporas y otra células sexuales. No necesitas los detalles aún; recuerda que las plantas son las grandes productoras, las que captan el sol."]},{"h":"Del agua a la tierra: el gran reto","paras":["La vida comenzó en el agua. Los ancestros de las plantas eran algas verdes, bañadas y sostenidas por su mundo líquido. Pasar a la tierra firme significaba resolver de golpe cuatro problemas difíciles: no secarse, mantenerse en pie, transportar el agua y el alimento dentro del cuerpo, y reproducirse sin agua para llevar las células masculinas.","La historia de las plantas es la de estos problemas resueltos, invento tras invento. Cada gran grupo que conocerás representa una nueva solución — y cada solución abrió un mundo nuevo."]},{"h":"Las briofitas — las pioneras","paras":["Los musgos, las hepáticas y los antoceros estuvieron entre las primeras plantas terrestres. Son pequeñas y rastreras, porque no tienen una verdadera fontanería interna (no tienen tejido vascular) para elevar el agua. Aún dependen de una película de agua para que sus células masculinas naden hasta el óvulo, por lo que prosperan en lugares húmedos y sombreados.","Piensa en las briofitas como los primeros colonos valientes: en tierra, pero nunca lejos de la humedad."]},{"h":"Los helechos y sus aliados — la primera fontanería","paras":["Los helechos trajeron una revolución: el tejido vascular, una red de tubos internos (xilema y floema) que sube el agua y hace circular el alimento. Con esa fontanería y un refuerzo, las plantas por fin pudieron crecer altas, y bosques de helechos arborescentes y colas de caballo cubrieron antaño la Tierra.","Los helechos aún se reproducen por esporas y aún necesitan agua para sus células masculinas: siguen atados a la humedad — pero demostraron que las plantas podían elevarse."]},{"h":"Las gimnospermas — la semilla desnuda","paras":["Los siguientes grandes inventos fueron la semilla y el polen. Una semilla es una diminuta planta llena de reservas y protegida por una cubierta; el polen transporta las células masculinas por el aire, de modo que el agua ya no es necesaria para la fecundación. Libres de la humedad, las plantas pudieron colonizar tierras secas y montañas frías.","Las gimnospermas — coníferas, cícadas y Ginkgo — llevan sus semillas « desnudas » sobre conos o escamas, no dentro de un fruto. Pinos, abetos y cedros son sus embajadores vivos."]},{"h":"Las angiospermas — la revolución de la flor","paras":["Luego llegó la flor. Las angiospermas encierran sus semillas dentro de un ovario protector que madura en fruto, y atraen a los animales con flores para transportar el polen y dispersar las semillas. Esta alianza con los animales desencadenó la explosión de diversidad más rápida de la historia de las plantas.","Hoy las plantas con flores dominan la tierra — cerca de nueve de cada diez especies de plantas. Casi todos nuestros cultivos, frutas, hierbas y flores de jardín son angiospermas."]},{"h":"Monocotiledóneas y dicotiledóneas: dos maneras de ser una planta con flores","paras":["Las plantas con flores se dividieron pronto en dos grandes linajes. Las monocotiledóneas tienen un solo cotiledón, hojas de nervadura paralela, piezas florales generalmente en tres y raíces fasciculadas — piensa en gramíneas, palmeras, orquídeas, lirios, jengibres.","Las eudicotiledóneas (a menudo llamadas dicotiledóneas) tienen dos cotiledones, hojas con una red ramificada de nervios, piezas florales generalmente en cuatro o cinco, y a menudo una raíz principal pivotante — piensa en frijoles, rosas, girasoles, mentas, robles. Aprender a distinguir estos dos grupos es una de las primeras destrezas reales del botánico."]},{"h":"Leer el árbol de la vida","paras":["Fíjate en el patrón: cada grupo conserva los inventos del anterior y añade uno nuevo. Los vasos, luego las semillas, luego las flores. Un árbol de parentesco (una filogenia) no hace más que dibujar ese orden de los inventos.","La idea clave es esta: las plantas que comparten un carácter suelen compartir un ancestro que lo hizo aparecer. Ver un carácter compartido es ver una pista de parentesco. Ese es el corazón de la botánica sistemática."]}],"terms":["fotosíntesis","espora","tejido vascular","semilla","polen","flor","fruto","cotiledón","monocotiledónea","eudicotiledónea","filogenia"],"tip":"Ante cualquier planta nueva, sitúala primero en el panorama general: ¿es un musgo, un helecho, una conífera o una planta con flores? Todo lo demás se vuelve más fácil cuando conoces el vecindario.","review":["Nombra los cuatro grandes grupos de plantas en el orden en que aparecieron.","¿Qué dos inventos liberaron a las plantas de necesitar agua para reproducirse?","Da una diferencia entre una monocotiledónea y una dicotiledónea."],"practice":"Sal y encuentra tres plantas diferentes. Para cada una, decide su gran grupo — musgo, helecho, conífera o planta con flores — y escribe una razón de tu elección.","diagrams":["tree","monoeu"]},{"num":2,"title":"Leer una planta: los caracteres que cuentan su historia","subtitle":"Cada órgano es una pista; la flor es el documento de identidad de la planta.","objectives":["Nombrar los principales órganos de una planta y su función.","Usar las hojas y las flores para situar una planta entre las familias.","Comprender por qué los caracteres compartidos definen las familias de plantas."],"sections":[{"h":"Raíces, tallos y hojas","paras":["El cuerpo de una planta tiene tres órganos básicos. Las raíces anclan la planta y absorben agua y minerales. El tallo eleva las hojas hacia la luz y hace circular el agua y el alimento entre raíces y hojas. Las hojas son los paneles solares, donde ocurre la fotosíntesis.","Por sencillo que parezca, la forma de estos órganos es la primera pista de la identidad y el modo de vida de una planta."]},{"h":"Las hojas: forma y disposición","paras":["Observa si una hoja es simple (una sola lámina) o compuesta (dividida en folíolos), y cómo se disponen las hojas en el tallo: opuestas (en pares), alternas (una por vez) o verticiladas (tres o más por nudo). Estos pequeños detalles son sorprendentemente poderosos para reconocer los grupos.","Los nervios también importan: nervios paralelos sugieren una monocotiledónea, una red ramificada una dicotiledónea."]},{"h":"La flor: el documento de identidad de la planta","paras":["Una flor típica se construye con cuatro anillos, de fuera hacia dentro: los sépalos (a menudo verdes, que protegen el botón), los pétalos (a menudo coloridos, que atraen a los polinizadores), los estambres (partes masculinas que producen polen) y los carpelos (partes femeninas que guardan los óvulos). Los botánicos los abrevian como K, C, A y G.","Contar y examinar estos cuatro anillos es el hábito más útil en la identificación. Más que cualquier otro órgano, la flor te dice a qué familia pertenece una planta."]},{"h":"De la flor al fruto y a la semilla","paras":["Tras la polinización, el ovario madura en fruto y los óvulos se convierten en semillas. Un fruto puede ser seco (una legumbre, una cápsula, una nuez) o carnoso (una baya, una drupa como el mango). El tipo de fruto suele ser una fuerte firma de familia.","Así, la flor y el fruto cuentan juntos lo esencial de la historia de una planta: cómo se reproduce y quiénes son sus parientes."]},{"h":"Cómo los caracteres forman las familias","paras":["Una familia de plantas es un grupo de géneros que comparten un conjunto de caracteres heredados de un ancestro común. Guisantes, frijoles y acacias comparten legumbres y flores en forma de mariposa — las Fabaceae. Girasoles, margaritas y lechugas comparten « capítulos » de muchas florecillas — las Asteraceae. Las gramíneas comparten tallos huecos y flores polinizadas por el viento — las Poaceae.","Una vez aprendida la firma de una familia, reconoces a sus miembros en cualquier parte del mundo, incluso los que nunca has visto. Ese es el poder de pensar en caracteres."]}],"terms":["raíz","tallo","hoja","sépalo","pétalo","estambre","carpelo","ovario","fruto","familia"],"tip":"Lleva una lupa de mano. La flor es el documento de identidad de la planta — cuenta sus piezas y ya estarás a medio camino de un nombre.","review":["¿Cuáles son los cuatro anillos de una flor típica?","Nombra una familia de plantas reconocible por su fruto o su flor.","¿Por qué los caracteres compartidos son la base de las familias de plantas?"],"practice":"Elige una flor que puedas examinar con seguridad. Cuenta sus sépalos, pétalos y estambres, y anota cómo se disponen las hojas en el tallo. Dibújala — sin nombre.","diagrams":["flower","leaf","fruit"]},{"num":3,"title":"Las plantas y su mundo: la adaptación al entorno","subtitle":"Cada forma extraña es una respuesta a una pregunta que hizo el entorno.","objectives":["Ver la adaptación como resolución de problemas, no como azar.","Reconocer las adaptaciones comunes al agua, la luz y el suelo.","Comprender las alianzas clave que ayudan a las plantas a sobrevivir."],"sections":[{"h":"El agua: demasiado poca o demasiada","paras":["El agua moldea a las plantas más que cualquier otro factor. En los desiertos, los xerófitos como los cactus almacenan agua en tallos hinchados, reducen sus hojas a espinas para limitar las pérdidas y abren sus poros solo de noche. En charcas y ríos, los hidrófitos como los nenúfares llenan sus tejidos de canales de aire (aerénquima) para flotar y respirar.","Ante una planta gruesa, cerosa o espinosa, piensa « mundo seco »; ante un tejido blando, esponjoso, flotante, piensa « mundo húmedo »."]},{"h":"La luz y el espacio","paras":["La luz es un premio por el que vale la pena competir. Las trepadoras y las lianas usan zarcillos y tallos volubles para alcanzar el dosel de forma barata, sin construir un tronco grueso. Los epífitos, como muchas orquídeas y bromelias, crecen encaramados sobre otras plantas, en plena luz, tomando el agua de la lluvia y del aire en lugar del suelo.","No son trucos; cada uno es una estrategia distinta para un mismo fin — un lugar al sol."]},{"h":"El suelo y las alianzas","paras":["Las raíces hacen más que beber. La mayoría de las plantas viven en alianza con hongos: las micorrizas envuelven o penetran las raíces y amplían enormemente su alcance para el agua y los nutrientes, a cambio de azúcares. Las leguminosas (la familia del guisante) se asocian con bacterias que captan el nitrógeno del aire y enriquecen el suelo — por eso se usan para restaurar tierras agotadas.","Una planta nunca está de verdad sola; es un nudo de alianzas discretas bajo tierra."]},{"h":"La reproducción: polinización y dispersión","paras":["Para reproducirse, una planta debe mover primero el polen y luego las semillas. La polinización puede valerse del viento (gramíneas, muchos árboles) o de animales atraídos por el color, el aroma y el néctar (abejas, mariposas, aves, murciélagos). La dispersión de semillas puede valerse del viento (semillas aladas o plumosas), del agua (cocos) o de los animales (frutos carnosos comidos y transportados, o semillas con ganchos que hacen autostop).","Flores y frutos, pues, no son adorno — son herramientas de movimiento, moldeadas por los socios de los que depende la planta."]}],"terms":["adaptación","xerófito","hidrófito","epífito","micorriza","fijación de nitrógeno","polinización","dispersión"],"tip":"Cuando una planta parezca inusual, pregúntate qué problema resuelve su forma. El entorno hace preguntas; la forma de la planta es su respuesta.","review":["Da una adaptación que ayude a una planta a sobrevivir a la sequía.","¿Qué es una micorriza y cómo ayuda a la planta?","Nombra dos maneras distintas en que viajan las semillas."],"practice":"Encuentra una planta que crezca en un lugar inusual (un muro, sombra profunda, suelo seco o agua). Pregunta: ¿qué problema resuelve su forma? Escribe tu mejor hipótesis.","diagrams":["adapt"]},{"num":4,"title":"La química de la supervivencia: cómo se protegen las plantas","subtitle":"Enraizadas en su sitio, las plantas se defienden con moléculas — y esas moléculas también nos sirven.","objectives":["Comprender por qué las plantas son grandes químicas.","Reconocer las principales clases de compuestos vegetales.","Ver cómo la química revela el parentesco y se convierte en un recurso para el ser humano."],"sections":[{"h":"Enraizadas, pero no indefensas","paras":["Una planta no puede huir de un insecto hambriento ni de un animal que pasta. En lugar de huir, las plantas luchan con química y estructura — espinas y fibras duras por fuera, y un vasto arsenal de moléculas protectoras por dentro. Buena parte de lo que saboreamos, olemos y usamos en las plantas nació como defensa.","Por eso las plantas son las mayores químicas de la naturaleza: la inmovilidad las obligó a volverse brillantes."]},{"h":"Las químicas de la defensa","paras":["Unas pocas grandes clases hacen casi todo el trabajo. Los alcaloides son compuestos amargos, ricos en nitrógeno — cafeína, nicotina, quinina — que disuaden o envenenan a los agresores. Los taninos son compuestos astringentes que hacen las hojas difíciles de digerir. Los glucosinolatos dan su picor a la mostaza, la col y el rábano picante. Los terpenos y aceites esenciales aportan los aromas de la menta, los cítricos, el eucalipto y el pino, repeliendo plagas y cicatrizando heridas.","Un sabor amargo, un olor intenso, una savia irritante: cada uno es una molécula haciendo su trabajo."]},{"h":"Colores con un propósito","paras":["Los colores de las plantas también son química. La clorofila vuelve verdes las hojas y capta la luz. Los carotenoides dan los amarillos y naranjas y protegen la hoja del exceso de sol. Las antocianinas pintan muchas flores y frutos de rojo, morado y azul, atrayendo a polinizadores y dispersores, mientras que las betalaínas producen el rojo-violeta de las remolachas y los cactus en un grupo especial de plantas.","Cada color de un jardín es un mensaje escrito en moléculas."]},{"h":"La química sigue el árbol de parentesco","paras":["Notablemente, estas moléculas suelen seguir el árbol de parentesco. Los pigmentos betalaínas aparecen casi solo en un orden (las Caryophyllales — cactus, remolachas, buganvillas). Los iridoides amargos marcan a muchas de las astéridas. Los glucosinolatos (aceites de mostaza) se agrupan en las parientes de la col. Como las plantas emparentadas heredan una química emparentada, un compuesto puede ser una pista de parentesco — un campo llamado quimiotaxonomía.","Así, el olor de una hoja estrujada no es solo agradable; puede susurrar a qué familia pertenece la planta."]},{"h":"De la defensa de la planta al beneficio humano","paras":["Aquí llega el giro apasionante: lo que protege a una planta a menudo sirve a las personas. Alcaloides de defensa se convirtieron en medicinas; terpenos aromáticos se convirtieron en perfumes, aromas y remedios; pigmentos se convirtieron en colorantes y alimentos. Comprender la química de las plantas es la puerta a la innovación en salud, alimentación y cosmética — siempre con respeto por los ecosistemas que la producen.","Conocer la química de una planta es tener una llave: hacia la sanación, el sabor, la invención."]}],"terms":["alcaloide","tanino","glucosinolato","terpeno / aceite esencial","pigmento","antocianina","betalaína","quimiotaxonomía"],"tip":"Huele, prueba (solo lo que sea seguro y conocido) y observa el color. Cada sensación es una molécula con una historia — y a menudo un uso.","review":["¿Por qué las plantas deben defenderse con química en lugar de con movimiento?","Nombra dos clases de moléculas de defensa y una planta para cada una.","¿Cómo puede la química de una planta insinuar sus parientes?"],"practice":"Estruja suavemente una hoja que sepas que es segura (menta, cítrico, eucalipto…) y huélela. Anota el olor y el color. ¿Para qué podría usar la planta esta molécula?","diagrams":[]},{"num":5,"title":"Del saber al impacto: tu camino con las plantas","subtitle":"La botánica en simple se convierte en una botánica con propósito.","objectives":["Ver cómo el saber vegetal sirve a la decisión, la innovación, la creación y la alegría personal.","Elegir tus próximos pasos como aprendiz de plantas de por vida.","Conectar tu aprendizaje con una comunidad más amplia de personas apasionadas por las plantas."],"sections":[{"h":"La botánica por pasión — ver la naturaleza de otro modo","paras":["El primer regalo de este saber es el asombro. En cuanto sabes nombrar los grupos, leer una flor y adivinar una adaptación, un paseo por un parque o un mercado se convierte en una conversación con los seres vivos. Dejas de depender solo de las aplicaciones y empiezas a pensar por ti mismo.","Esa es la botánica por pasión: una curiosidad que nunca se agota, porque siempre hay otra planta que comprender."]},{"h":"La botánica para decidir","paras":["El saber guía las buenas elecciones. ¿Qué árboles plantar en una ciudad seca? ¿Qué especies proteger en un bosque amenazado? ¿Qué planta conviene de verdad a una necesidad? Comprender las plantas — sus grupos, sus necesidades, su química — convierte las conjeturas en decisiones sabias para jardines, salud, agricultura y conservación.","Para decidir bien sobre las plantas, primero hay que comprenderlas."]},{"h":"La botánica para innovar","paras":["El mundo vegetal es un tesoro de soluciones para la alimentación, la medicina, los materiales y el bienestar. La verdadera innovación no se limita a extraer de las plantas; comprende su ecología y su química, y construye soluciones que sanan a las personas y restauran la naturaleza al mismo tiempo.","Las mejores ideas basadas en plantas están enraizadas en la botánica, no solo en los negocios."]},{"h":"La botánica para crear","paras":["El saber crece cuando se comparte. Docentes, autores, jardineros, fotógrafos y creadores de contenido transforman la comprensión de las plantas en relatos que llegan a otros. Si aprendes a ver con claridad las plantas, puedes ayudar a que muchas más personas también las vean.","Crear con plantas es transmitir el asombro."]},{"h":"Seguir creciendo — tus próximos pasos","paras":["Ahora posees una manera de mirar: observar, comparar, conectar. Practícala con las plantas que te rodean. Usa el Explorador interactivo que acompaña este curso para situar cualquier familia en el árbol de la vida, y el Glosario trilingüe para dominar el vocabulario a tu ritmo.","La botánica en simple no es el final del camino — es el primer paso de un recorrido para toda la vida. Bienvenido a la comunidad de personas conectadas por el poder de las plantas."]}],"terms":["curiosidad","observación","comparación","conexión","cuidado responsable"],"tip":"No necesitas memorizar cada planta. Necesitas saber cómo mirar y dónde conectar lo que ves. Esa mentalidad es todo el curso.","review":["Con tus palabras, ¿qué significa « pensar como un botánico »?","¿Cuál de los caminos — pasión, decisión, innovación, creación — te habla más, y por qué?","¿Qué planta cercana a ti vas a observar esta semana?"],"practice":"Elige una planta que te importe. Escribe por qué te importa y una decisión o idea que tu nuevo saber podría mejorar.","diagrams":[]}],"capstone":{"kicker":"Proyecto final","title":"Tu primer cuaderno de botánico","intro":"Reúne todo el curso. Elige una planta cerca de ti y descríbela con todo lo que has aprendido:","steps":["Su gran grupo, y un carácter que lo demuestre.","La forma de sus hojas y, si la tiene, de su flor.","Una manera en que está adaptada a su lugar.","Un olor, un sabor (solo si es seguro y conocido) o un color — y para qué podría usarlo la planta.","Una razón por la que esta planta te importa."],"keep":"Guarda esta página. Es tu primera observación botánica real — el comienzo de tu cuaderno."},"completion":{"title":"Has dado el primer paso.","text":"Ahora posees una manera de mirar: observar, comparar, conectar. Esta base es el punto de partida de un camino de por vida con las plantas. ¿Listo para profundizar, afinar tus destrezas y convertirte en un verdadero Botapreneur?","btn":"Continuar con PlantsMastery","url":"https://www.plantsmastery.com","note":"PlantsMastery es el itinerario de formación de Botapreneurs — la siguiente etapa de tu aprendizaje."},"vis":{"steps":{"life":"Vida","land":"Tierra","transport":"Transporte","seed":"Semilla","flower":"Flor"},"lin":{"algae":"Algas verdes","bryo":"Musgos","fern":"Helechos","gymno":"Coníferas","angio":"Plantas con flores"},"treeFoot":"Cada grupo conserva los inventos antiguos y añade uno nuevo — una historia de innovación útil.","mono":"Monocotiledóneas","eudi":"Eudicotiledóneas (dicots)","rSeed":"Cotiledones","rVein":"Nervios","rFlower":"Piezas florales","rRoot":"Raíces","monoSeed":"1","eudiSeed":"2","monoVein":"paralelos","eudiVein":"en red","monoFlower":"en 3","eudiFlower":"en 4 o 5","monoRoot":"fasciculadas","eudiRoot":"pivotante","sepals":"Sépalos","petals":"Pétalos","stamens":"Estambres","carpels":"Carpelos","opposite":"Opuestas","alternate":"Alternas","whorled":"Verticiladas","dry":"Fruto seco","fleshy":"Fruto carnoso","dryEx":"legumbre · cápsula · nuez","fleshyEx":"baya · drupa","cactus":"Cactus","dryWorld":"mundo seco","lily":"Nenúfar","wetWorld":"mundo húmedo","caps":{"tree":"La historia de las plantas: una escalera de inventos útiles","monoeu":"Dos maneras de ser una planta con flores","flower":"La flor: cuatro anillos (K · C · A · G)","leaf":"Patrones de disposición de las hojas","fruit":"Fruto seco vs carnoso","adapt":"Mismo objetivo, respuestas distintas"}}}};
