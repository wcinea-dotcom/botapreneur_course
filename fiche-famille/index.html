<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botapreneurs — Fiche famille (patterns par famille)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Lato:wght@400;700&display=swap');
:root{--navy:#003366;--green:#2E7D32;--lime:#8BC34A;--orange:#F47C20;--beige:#F8F8F4;--ink:#2B2B2B;--line:#e2e6ea}
*{box-sizing:border-box}body{margin:0;background:var(--beige);color:var(--ink);font-family:Lato,system-ui,Arial,sans-serif}
.top{background:var(--navy);color:#fff;padding:16px 4vw;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.wm{font-family:Poppins;font-weight:800;font-size:22px}.wm .b{color:var(--lime)}
.back{color:#cfe0f0;text-decoration:none;font-size:13px;border:1px solid #3a5a7a;border-radius:8px;padding:6px 12px}
.back:hover{background:#0a4a86}
.bar{padding:18px 4vw;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:#fff}
.bar label{font-family:Poppins;font-weight:700;color:var(--green);font-size:13px;letter-spacing:1px;text-transform:uppercase}
.familySearch{position:relative;width:min(360px,100%)}
.familySearch input{font-family:inherit;font-size:16px;width:100%;padding:11px 42px 11px 14px;border:1px solid #aebbc5;border-radius:10px;background:#fff;color:var(--ink);outline:none}
.familySearch input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,125,50,.14)}
.familySearch .searchIcon{position:absolute;right:13px;top:10px;color:var(--green);font-size:18px;pointer-events:none}
.familyResults{display:none;position:absolute;z-index:30;left:0;right:0;top:calc(100% + 5px);max-height:280px;overflow-y:auto;background:#fff;border:1px solid #c3ccd4;border-radius:10px;box-shadow:0 10px 26px rgba(0,51,102,.15);padding:5px}
.familyResults.open{display:block}
.familyOption{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;background:#fff;border-radius:7px;padding:9px 10px;text-align:left;color:var(--navy);font:600 14px Poppins,sans-serif;cursor:pointer}
.familyOption:hover,.familyOption.active{background:#eef3ea;color:var(--green)}
.familyOption small{font:400 12px Lato,sans-serif;color:#7a8590;white-space:nowrap}
.noFamily{padding:12px;color:#7a8590;font-size:13px}
.hint{color:#7a8590;font-size:13px}
.head{padding:22px 4vw 6px}
.head h1{font-family:Poppins;font-weight:800;color:var(--navy);font-size:clamp(24px,4vw,38px);margin:0}
.head .cnt{color:var(--green);font-family:Poppins;font-weight:700;font-size:14px;margin-top:4px}
.sig{background:#eef3ea;border-left:4px solid var(--lime);padding:12px 16px;margin:12px 4vw 0;border-radius:8px;max-width:900px;font-size:14px;line-height:1.55}
.sig b{font-family:Poppins;color:var(--green)}
.organ{padding:16px 4vw 4px}
.organ h3{font-family:Poppins;font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--green);display:inline-block;padding:5px 12px;border-radius:8px;margin:0 0 10px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in}
.ph .im{aspect-ratio:1/1;background:#eef1f3;overflow:hidden}.ph .im img{width:100%;height:100%;object-fit:cover;display:block}
.ph .bd{padding:7px 9px}.ph .nm{font-size:12px;font-weight:700;color:var(--navy);line-height:1.25;margin-bottom:3px}
.tag{display:inline-block;background:#eef3ea;color:var(--green);border-radius:5px;padding:1px 6px;font-size:10px;margin:0 3px 3px 0}
.organTag{background:#e7eef7;color:var(--navy);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.void{color:#9aa7b0;font-size:13px;font-family:Poppins;font-weight:600;background:#fff;border:1px dashed #cdd6de;border-radius:12px;padding:16px;text-align:center}
.void .plus{font-size:24px;color:#c7d2da;display:block}
.modal{display:none;position:fixed;inset:0;z-index:60;background:rgba(7,20,30,.94)}
.modal.open{display:flex;align-items:center;justify-content:center}
.modal img{max-width:92vw;max-height:92vh;object-fit:contain}
.modal .x{position:absolute;top:16px;right:20px;color:#fff;border:1px solid #4a6a86;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer}
</style></head><body>
<header class="top"><div class="wm">Bota<span class="b">preneurs</span> · Fiche famille</div>
<a class="back" href="../index.html">← Retour au cours</a></header>

<div class="bar"><label for="familySearchInput">Rechercher une famille</label>
 <div class="familySearch" id="familySearchBox">
  <input id="familySearchInput" type="search" placeholder="Ex. Moraceae, Annonaceae…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="familyResults">
  <span class="searchIcon" aria-hidden="true">⌕</span>
  <div class="familyResults" id="familyResults" role="listbox"></div>
 </div>
 <span class="hint">Choisis une famille → vois toutes ses photos par organe, pour apprendre sa signature.</span></div>

<div class="head" id="head"></div>
<div id="sig"></div>
<div id="body"></div>

<div class="modal" id="modal"><button class="x" onclick="closeM()">FERMER ×</button><img id="mImg" alt=""></div>

<script src="../plant-patterns/seed-gallery.js"></script>
<script>
let DATA=null;
function photo(p,organ){
 const tags=(p.patterns||[]).map(t=>`<span class="tag">${t}</span>`).join("");
 return `<div class="ph" onclick="openM('${p.img}')"><div class="im"><img loading="lazy" src="${p.img}"></div><div class="bd"><div class="nm">${p.nom||""}</div><span class="tag organTag">Organe : ${organ}</span>${tags}</div></div>`;
}
function detailScore(p){return (p.patterns||[]).some(t=>/pétale|détach|coupe|intérieur|dissection/i.test(t))?1:0;}
function render(f){
 const total=DATA.organes.reduce((s,o)=>s+((f.organes[o]||[]).length),0);
 document.getElementById("head").innerHTML=`<h1>${f.fam}</h1><div class="cnt">${total} photo(s) · ${DATA.organes.filter(o=>(f.organes[o]||[]).length).length} organe(s) documenté(s)</div>`;
 document.getElementById("sig").innerHTML=f.note?`<div class="sig"><b>SIGNATURE DE LA FAMILLE — ce qu'il faut regarder</b><br>${f.note}</div>`:"";
 let h="";
 DATA.organes.forEach(o=>{
  const arr=[...(f.organes[o]||[])].sort((a,b)=>detailScore(b)-detailScore(a));
  h+=`<div class="organ"><h3>${o} · ${arr.length}</h3>`;
  h+= arr.length ? `<div class="gal">${arr.map(p=>photo(p,o)).join("")}</div>` : `<div class="void"><span class="plus">＋</span>Aucune photo ${o.toLowerCase()} pour cette famille — à alimenter</div>`;
  h+=`</div>`;
 });
 document.getElementById("body").innerHTML=h;
}
function openM(src){document.getElementById("mImg").src=src;document.getElementById("modal").classList.add("open");}
function closeM(){document.getElementById("modal").classList.remove("open");}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeM();};
document.onkeydown=e=>{if(e.key==="Escape")closeM();};

function normalizeText(value){
 return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}
function familyTotal(f){
 return DATA.organes.reduce((sum,organ)=>sum+((f.organes[organ]||[]).length),0);
}
function selectFamily(f){
 document.getElementById("familySearchInput").value=f.fam;
 closeFamilyResults();
 render(f);
}
function closeFamilyResults(){
 const results=document.getElementById("familyResults");
 results.classList.remove("open");
 document.getElementById("familySearchInput").setAttribute("aria-expanded","false");
}
function showFamilyResults(query=""){
 const input=document.getElementById("familySearchInput");
 const results=document.getElementById("familyResults");
 const needle=normalizeText(query);
 const matches=DATA.familles
  .filter(f=>normalizeText(f.fam).includes(needle))
  .sort((a,b)=>{
   const aName=normalizeText(a.fam),bName=normalizeText(b.fam);
   return Number(bName.startsWith(needle))-Number(aName.startsWith(needle))||aName.localeCompare(bName);
  });
 results.innerHTML=matches.length
  ? matches.map((f,i)=>`<button class="familyOption${i===0?" active":""}" type="button" role="option" aria-selected="${i===0}" data-family="${f.fam}"><span>${f.fam}</span><small>${familyTotal(f)} photo(s)</small></button>`).join("")
  : `<div class="noFamily">Aucune famille trouvée pour « ${query.replace(/[<>]/g,"")} ».</div>`;
 results.classList.add("open");
 input.setAttribute("aria-expanded","true");
 results.querySelectorAll(".familyOption").forEach(button=>{
  button.onclick=()=>selectFamily(DATA.familles.find(f=>f.fam===button.dataset.family));
 });
}

function linkValidatedSeedsToFamilies(data){
 const seeds=Array.isArray(window.SEED_MEDIA)?window.SEED_MEDIA:[];
 const byFamily=new Map(data.familles.map(f=>[normalizeText(f.fam),f]));
 const emptyOrgans=()=>Object.fromEntries(data.organes.map(organ=>[organ,[]]));
 seeds.forEach(seed=>{
  const key=normalizeText(seed.family);
  let family=byFamily.get(key);
  if(!family){
   family={
    fam:seed.family,
    note:seed.family==="Bixaceae"?"Famille illustrée ici par Bixa orellana. Les semences validées constituent le premier matériel documentaire; les autres organes seront complétés progressivement.":"",
    organes:emptyOrgans()
   };
   data.familles.push(family);
   byFamily.set(key,family);
  }
  data.organes.forEach(organ=>{if(!Array.isArray(family.organes[organ]))family.organes[organ]=[]});
  const semences=family.organes.Semence;
  if(!semences.some(item=>item.img===seed.src)){
   semences.push({
    img:seed.src,
    nom:seed.name,
    confidence:"validé par William",
    patterns:["semence",seed.family,"identification validée"]
   });
  }
 });
 data.familles.sort((a,b)=>a.fam.localeCompare(b.fam,"fr"));
}

fetch("data/familles.json").then(r=>r.json()).then(d=>{
 linkValidatedSeedsToFamilies(d);
 DATA=d;
 const input=document.getElementById("familySearchInput");
 input.addEventListener("focus",()=>showFamilyResults(input.value));
 input.addEventListener("input",()=>showFamilyResults(input.value));
 input.addEventListener("keydown",e=>{
  const options=[...document.querySelectorAll(".familyOption")];
  if(!options.length)return;
  let active=options.findIndex(option=>option.classList.contains("active"));
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
   e.preventDefault();
   options[active]?.classList.remove("active");
   options[active]?.setAttribute("aria-selected","false");
   active=e.key==="ArrowDown"?Math.min(active+1,options.length-1):Math.max(active-1,0);
   options[active].classList.add("active");
   options[active].setAttribute("aria-selected","true");
   options[active].scrollIntoView({block:"nearest"});
  }else if(e.key==="Enter"){
   e.preventDefault();
   options[Math.max(active,0)].click();
  }else if(e.key==="Escape")closeFamilyResults();
 });
 document.addEventListener("click",e=>{if(!document.getElementById("familySearchBox").contains(e.target))closeFamilyResults();});
 if(d.familles.length)selectFamily(d.familles[0]);
}).catch(err=>{document.getElementById("body").innerHTML=`<p style="color:#b00;padding:0 4vw">Erreur : ${err.message} (ouvre via un serveur).</p>`;});
</script>
</body></html>
