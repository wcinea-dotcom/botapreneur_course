<title>Botapreneurs — Patterns & Leçons des feuilles</title>

:root{--navy:#003366;--green:#2E7D32;--lime:#8BC34A;--orange:#F47C20;--beige:#F8F8F4;--ink:#2B2B2B;--line:#e2e6ea}
*{box-sizing:border-box}body{margin:0;background:var(--beige);color:var(--ink);font-family:Lato,Arial,sans-serif}
.top{background:var(--navy);color:#fff;padding:18px 4vw}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.wm{font-family:Poppins;font-weight:800;font-size:26px}.wm .b{color:var(--lime)}
.kick{font-family:Poppins;font-weight:600;font-size:12px;letter-spacing:2px;color:#B9D9F0;margin-top:2px}
.langs{display:flex;gap:4px}.langs button{border:1px solid #3a5a7a;background:transparent;color:#c7d6e4;padding:5px 9px;font-size:12px;cursor:pointer;border-radius:4px}
.langs .on{background:var(--lime);color:var(--navy);border-color:var(--lime);font-weight:700}
.tabs{display:flex;gap:8px;margin-top:14px}
.tabs button{font-family:Poppins;font-weight:700;font-size:15px;border:0;border-radius:8px 8px 0 0;padding:11px 22px;background:#0a4a86;color:#cfe0f0;cursor:pointer}
.tabs button.on{background:var(--beige);color:var(--navy)}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:80vh}
aside{background:#eef1f4;border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto}
aside .srch{width:100%;border:1px solid #c3ccd4;border-radius:999px;padding:9px 12px;font-size:13px;margin-bottom:6px;font-family:inherit}
.results{padding:22px 4vw 60px}
.rbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.count{font-family:Poppins;font-weight:700}.count b{color:var(--green)}
.reset{border:1px solid #c3ccd4;background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px}
/* facets */
.grp{border-bottom:1px solid #e4e8ec;padding-bottom:8px;margin-bottom:8px}
.grp h3{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;font-family:Poppins;font-weight:700;font-size:12px;letter-spacing:1px;color:var(--green);text-transform:uppercase;margin:0}
.grp h3::after{content:"\25B8";font-size:12px;color:#8aa;transition:transform .15s;margin-left:6px}
.grp.open h3::after{transform:rotate(90deg)}
.grp .gc{background:#e0e7ee;color:#557;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:auto;margin-right:4px}
.grp .chips{display:flex;flex-wrap:wrap;margin-top:8px}
.grp:not(.open) .chips{display:none}
.chip{border:1px solid #cfd7de;background:#fff;border-radius:999px;padding:5px 10px;margin:0 6px 6px 0;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--green)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .c{background:#eef1f4;color:#557;border-radius:9px;padding:0 6px;font-size:10px}.chip.on .c{background:#0a4a86;color:#fff}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in}
.card .im{aspect-ratio:1/1;background:#eef1f3;overflow:hidden}.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:9px 11px}.card .fe{font-family:Poppins;font-weight:700;color:var(--green);font-size:12px}
.card .nm{font-weight:700;font-size:14px;margin:1px 0 6px;color:var(--navy)}
.tag{display:inline-block;background:#eef3ea;color:var(--green);border-radius:6px;padding:2px 7px;font-size:11px;margin:0 4px 4px 0}
.tag.nv{background:#eaf0f6;color:var(--navy)}
.uses{color:#7a8590;font-size:11px;margin-top:3px}
/* leçons menu */
.lgrp{margin-bottom:18px}.lgrp b{display:block;font-family:Poppins;font-weight:700;font-size:11px;letter-spacing:1px;color:var(--green);text-transform:uppercase;margin:0 6px 6px}
.lgrp button{width:100%;border:0;border-left:3px solid transparent;background:transparent;text-align:left;padding:9px 10px;color:#4c5a52;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-family:inherit}
.lgrp button:hover,.lgrp button.on{background:#fff;border-left-color:var(--green);color:var(--navy);font-weight:700}
.lgrp button i{font-style:normal;background:#e0e7ee;color:#506356;border-radius:999px;padding:1px 7px;font-size:10px}
.lgrp button.on i{background:var(--lime);color:var(--navy)}
.crumb{font-family:Poppins;font-weight:700;font-size:11px;letter-spacing:1px;color:var(--green)}
.lhead{border-bottom:1px solid var(--line);padding-bottom:18px;margin-top:8px}
.lhead h2{font-family:Poppins;font-weight:800;font-size:clamp(28px,4vw,48px);color:var(--navy);margin:8px 0}
.def{font-size:16px;line-height:1.6;max-width:640px}
.how{background:#eef3ea;border-left:4px solid var(--lime);padding:14px 16px;margin-top:14px;font-size:13px;line-height:1.55;max-width:640px}
.how b{font-family:Poppins;color:var(--green)}
.fban{display:flex;gap:16px;align-items:flex-start;background:var(--navy);color:#fff;border-radius:12px;padding:18px;margin:18px 0}
.fban strong{font-family:Poppins;font-size:22px;color:var(--lime)}.fban p{font-size:12px;line-height:1.55;margin:6px 0 0;color:#cfe0f0}
.lcount{font-family:Poppins;font-weight:700;margin:18px 0 10px;color:var(--navy)}.lcount b{color:var(--green);font-size:24px}
/* modal zoom */
.modal{display:none;position:fixed;inset:0;z-index:60;background:rgba(7,20,30,.94);color:#fff}
.modal.open{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}
.zoomArea{position:relative;height:100vh;overflow:hidden;background:#08131c;cursor:grab;touch-action:none}
.zoomArea.dragging{cursor:grabbing}.zoomArea img{width:100%;height:100%;object-fit:contain;transform-origin:center;user-select:none;pointer-events:none}
.zc{position:absolute;left:14px;top:14px;display:flex;gap:5px;background:rgba(0,20,40,.85);padding:6px;border-radius:8px}
.zc button{border:1px solid #4a6a86;background:var(--navy);color:#fff;min-width:38px;height:36px;cursor:pointer;font-weight:700;border-radius:6px}
.zc button:hover{background:var(--lime);color:var(--navy)}
.zlv{min-width:52px;display:grid;place-items:center;font-size:11px}
.mInfo{padding:5vh 22px;overflow:auto}.mInfo .x{float:right;border:1px solid #4a6a86;background:transparent;color:#fff;padding:8px 11px;border-radius:6px;cursor:pointer}
.mInfo h3{font-family:Poppins;font-weight:800;font-size:26px;margin:40px 0 6px;color:#fff}.mInfo .fe{color:var(--lime);font-family:Poppins;font-weight:700}
.trg{margin-top:20px;border-top:1px solid #33546e}
.trg p{border-bottom:1px solid #33546e;padding:11px 0;margin:0;font-size:12px;color:#dce7f0}
.trg b{display:block;color:var(--lime);font-size:9px;letter-spacing:1px;margin-bottom:3px;font-family:Poppins}
.hide{display:none}
@media(max-width:820px){.layout{display:block}aside{position:static;height:auto}.modal.open{display:block;overflow:auto}.zoomArea{height:52vh}}

const GENFAM="Les caractères foliaires d'une famille sont des tendances documentaires à comparer — jamais une règle absolue. Confirmer avec fleurs et fruits.";
let DEFS=LES.definitions||{}, DIMS=LES.dimensions||[], FAMNOTE=LES.familles_notes||{};

/* EXPLORATEUR */
const GROUPS=[["fam","Famille"],["type","Type de feuille"],["comp","Composition"],["part","Particularité"],["nerv","Nervation"],["phyllo","Phyllotaxie"],["forme","Forme du limbe"],["marge","Marge"],["uses","Usage"]];
const sel={}; let Q=""; GROUPS.forEach(g=>sel[g[0]]=new Set());
function vals(k){const m={};DATA.forEach(d=>{let vs=d[k];if(!Array.isArray(vs))vs=[vs];vs.forEach(v=>{if(v)m[v]=(m[v]||0)+1})});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function buildFacets(){let h="";GROUPS.forEach(([k,label])=>{const vs=vals(k);h+=`<div class="grp" data-k="${k}"><h3>${label}<span class="gc">${vs.length}</span></h3><div class="chips">`;vs.forEach(([v,c])=>{h+=`<span class="chip" data-g="${k}" data-v="${v}">${v}<span class="c">${c}</span></span>`});h+="</div></div>"});
 const a=document.getElementById("facets");a.innerHTML=h;
 a.querySelectorAll(".grp h3").forEach(hh=>hh.onclick=()=>hh.parentElement.classList.toggle("open"));
 a.querySelectorAll(".chip").forEach(ch=>ch.onclick=(e)=>{e.stopPropagation();const g=ch.dataset.g,v=ch.dataset.v;sel[g].has(v)?sel[g].delete(v):sel[g].add(v);renderExpl()})}
function match(d){return GROUPS.every(([k])=>{if(sel[k].size===0)return true;let vs=d[k];if(!Array.isArray(vs))vs=[vs];return [...sel[k]].some(v=>vs.includes(v))})}
function renderExpl(){document.querySelectorAll("#facets .chip").forEach(ch=>ch.classList.toggle("on",sel[ch.dataset.g].has(ch.dataset.v)));
 document.querySelectorAll(".grp").forEach(g=>{if(sel[g.dataset.k]&&sel[g.dataset.k].size>0)g.classList.add("open")});
 const list=DATA.filter(d=>match(d)&&(!Q||[d.nom,d.fam,d.notion,d.forme,d.part,d.type,d.comp,d.nerv,d.marge,d.phyllo].join(" ").toLowerCase().includes(Q)));
 document.getElementById("n").textContent=list.length;
 document.getElementById("grid").innerHTML=list.map(d=>card(d)).join("")}
function card(d){const i=DATA.indexOf(d);return `<div class="card" onclick="openM(${i})"><div class="im"><img loading="lazy" src="${d.img}"></div><div class="bd"><div class="fe">${d.fe}</div><div class="nm">${d.nom}</div><div><span class="tag">${d.type}</span><span class="tag nv">${d.nerv}</span>${d.part?`<span class="tag">${d.part}</span>`:""}</div></div></div>`}
function resetF(){GROUPS.forEach(([k])=>sel[k].clear());Q="";document.getElementById("q").value="";renderExpl()}

/* LEÇONS */
function lvals(k){const m={};DATA.forEach(d=>{const v=d[k];if(v)m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function drawLessons(query=""){const q=query.trim().toLowerCase();let h="";
 DIMS.forEach(([k,label])=>{let items=lvals(k).filter(([v])=>!q||(`${v} ${label}`.toLowerCase().includes(q)));
  if(items.length)h+=`<div class="lgrp"><b>${label}</b>${items.map(([v,c])=>`<button data-k="${k}" data-v="${v}"><span>${v}</span><i>${c}</i></button>`).join("")}</div>`});
 const mnu=document.getElementById("lmenu");mnu.innerHTML=h||'<div style="padding:20px;color:#889">Aucune leçon.</div>';
 mnu.querySelectorAll("button").forEach(b=>b.onclick=()=>showLesson(b.dataset.k,b.dataset.v))}
function showLesson(k,v){
 document.querySelectorAll("#lmenu button").forEach(b=>b.classList.toggle("on",b.dataset.k===k&&b.dataset.v===v));
 const isFam=(k==="fam");const list=DATA.filter(d=>d[k]===v);
 const def=DEFS[v]?DEFS[v][0]:(isFam?(FAMNOTE[v]||GENFAM):"Pattern documenté à partir des exemples ci-dessous.");
 const how=DEFS[v]?DEFS[v][1]:"Comparer plusieurs exemples pour distinguer ce qui reste constant malgré la diversité des plantes.";
 const dimLabel=(DIMS.find(d=>d[0]===k)||[,""])[1];
 const fam=isFam?`<div class="fban"><div><strong>${v}</strong><p><b>PATTERNS FAMILIAUX</b> — ${FAMNOTE[v]||GENFAM}</p></div></div>`:"";
 document.getElementById("lesson").innerHTML=
  `<div class="crumb">${isFam?"FAMILLE BOTANIQUE":dimLabel.toUpperCase()}</div>
   <div class="lhead"><h2>${v}</h2><p class="def">${def}</p>
   <div class="how"><b>CE QU'IL FAUT REGARDER</b><br>${how}</div></div>${fam}
   <div class="lcount"><b>${list.length}</b> exemple(s) à comparer · clique pour agrandir</div>
   <div class="grid">${list.map(d=>card(d)).join("")}</div>
   <p style="color:#7a8590;font-size:11px;margin-top:16px">Une même photo peut documenter plusieurs caractères. « À confirmer » ≠ « absent ».</p>`}

/* MODALE ZOOM */
let zoom=1,px=0,py=0,drag=false,sx=0,sy=0;
function applyZoom(){mImg.style.transform=`translate(${px}px,${py}px) scale(${zoom})`;document.getElementById("zlv").textContent=Math.round(zoom*100)+"%";zoomArea.classList.toggle("dragging",drag)}
function setZoom(z){zoom=Math.max(1,Math.min(6,z));if(zoom===1){px=0;py=0}applyZoom()}
function resetZoom(){zoom=1;px=0;py=0;drag=false;applyZoom()}
function openM(i){const d=DATA[i];mImg.src=d.img;document.getElementById("mFe").textContent=d.fe;document.getElementById("mTitle").textContent=d.nom;resetZoom();
 document.getElementById("mGrid").innerHTML=
  `<p><b>FAMILLE</b>${d.fam}</p><p><b>TYPE</b>${d.type}</p><p><b>COMPOSITION</b>${d.comp||"—"}</p>
   <p><b>FORME</b>${d.forme}</p><p><b>MARGE</b>${d.marge}</p><p><b>NERVATION</b>${d.nerv}</p>
   <p><b>PHYLLOTAXIE</b>${d.phyllo||"—"}</p><p><b>PARTICULARITÉ</b>${d.part||"—"}</p><p><b>NOTION</b>${d.notion}</p>`;
 modal.classList.add("open")}
function closeM(){modal.classList.remove("open");resetZoom()}
zoomArea.onwheel=e=>{e.preventDefault();setZoom(zoom+(e.deltaY<0?.35:-.35))};
zoomArea.ondblclick=()=>setZoom(zoom===1?2.5:1);
zoomArea.onpointerdown=e=>{if(zoom<=1)return;drag=true;sx=e.clientX-px;sy=e.clientY-py;zoomArea.setPointerCapture(e.pointerId);applyZoom()};
zoomArea.onpointermove=e=>{if(!drag)return;px=e.clientX-sx;py=e.clientY-sy;applyZoom()};
zoomArea.onpointerup=zoomArea.onpointercancel=()=>{drag=false;applyZoom()};
modal.onclick=e=>{if(e.target===modal)closeM()};
document.onkeydown=e=>{if(e.key==="Escape")closeM()};

/* TABS */
function switchTab(t){const e=t==="expl";document.getElementById("viewExpl").classList.toggle("hide",!e);document.getElementById("viewLec").classList.toggle("hide",e);
 document.getElementById("tabExpl").classList.toggle("on",e);document.getElementById("tabLec").classList.toggle("on",!e)}

buildFacets();renderExpl();document.getElementById("tot").textContent=DATA.length;
drawLessons();showLesson("phyllo","Opposée");

</script></body></html>
