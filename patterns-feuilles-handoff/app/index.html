<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botapreneurs — Patterns & Leçons des feuilles</title>
<link rel="stylesheet" href="css/styles.css">
</head><body>
<header class="top"><div class="bar"><div><div class="wm">Bota<span class="b">preneurs</span></div><div class="kick">PATTERNS DES FEUILLES · PLANT ENTHUSIASTS</div></div>
<div class="langs"><button class="on">FR</button><button title="Bientôt">EN</button><button title="Bientôt">ES</button></div></div>
<div class="tabs"><button id="tabExpl" class="on" onclick="switchTab('expl')">🔎 Explorateur</button><button id="tabLec" onclick="switchTab('lec')">📖 Leçons</button></div></header>

<div id="viewExpl"><main class="layout"><aside>
 <input class="srch" id="q" placeholder="🔍 Rechercher : nom, famille, particularité…" oninput="Q=this.value.toLowerCase();renderExpl()">
 <div id="facets"></div></aside>
 <section class="results"><div class="rbar"><div class="count"><b id="n">0</b> / <span id="tot">0</span> plantes</div><button class="reset" onclick="resetF()">↺ Réinitialiser</button></div>
 <div class="grid" id="grid"></div></section></main></div>

<div id="viewLec" class="hide"><main class="layout"><aside>
 <input class="srch" id="lq" placeholder="🔍 Rechercher une leçon…" oninput="drawLessons(this.value)">
 <div id="lmenu"></div></aside>
 <section class="results" id="lesson"></section></main></div>

<div class="modal" id="modal"><div class="zoomArea" id="zoomArea"><div class="zc"><button onclick="setZoom(zoom-.5)">−</button><span class="zlv" id="zlv">100%</span><button onclick="setZoom(zoom+.5)">+</button><button onclick="resetZoom()">↺</button></div><img id="mImg" alt=""></div>
 <div class="mInfo"><button class="x" onclick="closeM()">FERMER ×</button><div class="fe" id="mFe"></div><h3 id="mTitle"></h3><div class="trg" id="mGrid"></div>
 <p style="color:#9fb4c6;font-size:11px;margin-top:16px">Observation visuelle de travail. Une valeur « à confirmer » n'est pas supposée : elle reste à valider avec fleurs et fruits.</p></div></div>

<script src="js/app.js"></script>
</body></html>
